ungkapan informasi pada kasus.","topic":"Pesan kesalahan login","level":"Penerapan","source":{"file":"Sesi3_Malware-dan-Teknik-Pengamanan-Sistem-Informasi.pdf","session":3,"page":6},"options":["Merancang pesan error yang tidak mengungkap kredensial mana yang salah","Menghapus seluruh pembatasan permintaan otentikasi","Memberi informasi akun yang lebih rinci pada setiap kesalahan","Menampilkan kata sandi agar pengguna dapat mencocokkan"],"answer":0},{"id":"STSI4405-19","question":"Token pada tautan reset kata sandi dapat diprediksi dan tidak memiliki masa kedaluwarsa. Karakteristik pengganti yang sesuai materi adalah ...","explanation":"Materi meminta token reset yang benar-benar acak, tidak dapat diprediksi, dan berumur pendek. Karakteristik tersebut menanggapi kelemahan pada kasus.","topic":"Pemulihan kata sandi","level":"Analisis","source":{"file":"Sesi3_Malware-dan-Teknik-Pengamanan-Sistem-Informasi.pdf","session":3,"page":7},"options":["Dibuat dari nomor urut pengguna tanpa batas waktu","Sama untuk semua pengguna agar mudah diperiksa","Berurutan dan berlaku selamanya","Acak, tidak dapat diprediksi, dan memiliki masa kedaluwarsa pendek"],"answer":3},{"id":"STSI4405-20","question":"Pengembang sedang memperbaiki session identifier yang mudah ditebak. Pilihan rancangan yang sesuai materi adalah ...","explanation":"Materi meminta session identifier yang random, tidak dapat diprediksi, hanya valid untuk satu sesi, serta time-limited.","topic":"Keamanan sesi","level":"Penerapan","source":{"file":"Sesi3_Malware-dan-Teknik-Pengamanan-Sistem-Informasi.pdf","session":3,"page":8},"options":["Sama untuk semua pengguna yang membuka halaman serupa","Berasal dari nomor urut pengguna dan berlaku permanen","Acak, tidak dapat diprediksi, valid untuk satu sesi, dan dibatasi waktu","Berurutan, valid untuk seluruh sesi, dan tanpa batas waktu"],"answer":2},{"id":"STSI4405-21","question":"Administrator perlu mengatur data atau informasi yang diizinkan melewati jaringan internal dari internet. Sarana yang sesuai fungsi dalam materi adalah ...","explanation":"Materi menjelaskan administrator dapat mengatur hal yang boleh dan tidak boleh dilewatkan pada jaringan internal melalui firewall.","topic":"Firewall","level":"Penerapan","source":{"file":"Sesi3_Malware-dan-Teknik-Pengamanan-Sistem-Informasi.pdf","session":3,"page":13},"options":["Digital watermark","PGP key","Fungsi hash","Firewall"],"answer":3},{"id":"STSI4405-22","question":"Sarana A memantau secara pasif dan memberi peringatan untuk ditelaah petugas. Sarana B merupakan perlindungan aktif. Identifikasi yang sesuai materi adalah ...","explanation":"IDS dijelaskan sebagai pemantauan pasif yang memberi peringatan, sedangkan IPS merupakan perlindungan aktif. Perbedaan peran itu menjadi dasar identifikasi.","topic":"IDS dan IPS","level":"Analisis","source":{"file":"Sesi3_Malware-dan-Teknik-Pengamanan-Sistem-Informasi.pdf","session":3,"page":14},"options":["A adalah PKI dan B adalah PGP","A adalah IDS dan B adalah IPS","A adalah IPS dan B adalah IDS","A dan B keduanya mekanisme hash"],"answer":1},{"id":"STSI4405-23","question":"Apa pembeda utama pengumpulan informasi aktif dari pasif atau OSINT menurut materi?","explanation":"Teknik aktif dijelaskan sebagai interaksi langsung dengan sistem target. Teknik pasif mengumpulkan informasi tanpa mengekspos keberadaan pengumpul.","topic":"Pengumpulan informasi","level":"Pemahaman","source":{"file":"Sesi4_Eksploitasi-Keamanan-Sistem-Informasi.pdf","session":4,"page":2},"options":["Pengumpulan pasif hanya dilakukan setelah seluruh pengujian selesai","Pengumpulan aktif selalu memakai media sosial tanpa interaksi sistem","Pengumpulan pasif harus mengubah konfigurasi sistem target","Pengumpulan aktif berinteraksi langsung dengan sistem target"],"answer":3},{"id":"STSI4405-24","question":"Tim yang berwenang akan mengkaji keamanan sistem organisasi. Pola pelaksanaan penetration testing yang sesuai materi adalah ...","explanation":"Materi menekankan pengujian yang metodis, terorganisir, dan terkontrol agar efektif mengkaji target. Pengumpulan informasi juga disebut sebagai langkah terpenting.","topic":"Pengujian keamanan terkontrol","level":"Penerapan","source":{"file":"Sesi4_Eksploitasi-Keamanan-Sistem-Informasi.pdf","session":4,"page":2},"options":["Mengabaikan pengumpulan informasi target","Metodis, terorganisir, dan terkontrol","Mengubah sistem tanpa kajian awal","Spontan tanpa pengaturan kegiatan"],"answer":1},{"id":"STSI4405-25","question":"Saat meninjau keterpaparan informasi bisnis, tim memeriksa situs organisasi, mitra, lowongan pekerjaan, dan dokumen perusahaan. Kelompok sumber dalam materi yang sesuai adalah ...","explanation":"Materi mencantumkan situs organisasi, mitra, lowongan pekerjaan, informasi keuangan, dan dokumen perusahaan di bawah mesin pencari.","topic":"Informasi bisnis terbuka","level":"Penerapan","source":{"file":"Sesi4_Eksploitasi-Keamanan-Sistem-Informasi.pdf","session":4,"page":3},"options":["Session identifier pada server","Tipe enkripsi jaringan nirkabel","Mesin pencari atau search engine","Pengaturan cookie pada sisi klien"],"answer":2},{"id":"STSI4405-26","question":"Organisasi menilai bahwa unggahan media sosial dapat mengungkap budaya perusahaan, hierarki, proses bisnis, dan teknologi. Penilaian ini ...","explanation":"Materi mencantumkan budaya perusahaan, hierarki, proses bisnis, teknologi, dan aplikasi sebagai informasi yang dapat dipelajari melalui media sosial. Temuan itu tidak membuktikan kondisi teknis lain.","topic":"Informasi pada media sosial","level":"Analisis","source":{"file":"Sesi4_Eksploitasi-Keamanan-Sistem-Informasi.pdf","session":4,"page":3},"options":["Tidak sesuai karena media sosial dibatasi hanya pada informasi keuangan","Membuktikan semua pengaturan sesi aplikasi telah aman","Tidak sesuai karena informasi organisasi hanya berasal dari DNS","Sesuai dengan informasi yang disebut dapat dipelajari dari media sosial"],"answer":3},{"id":"STSI4405-27","question":"Kelompok informasi yang ditempatkan dalam kategori infrastruktur pada materi pengumpulan informasi bisnis adalah ...","explanation":"Bagian infrastruktur menyebut domain, DNS server, mail server, dan IP address server utama. Pilihan lain berasal dari kelompok informasi berbeda.","topic":"Informasi infrastruktur","level":"Pemahaman","source":{"file":"Sesi4_Eksploitasi-Keamanan-Sistem-Informasi.pdf","session":4,"page":3},"options":["Nama pemilik key, tujuan key, algoritma key, dan tanggal kedaluwarsa key","Budaya perusahaan, hierarki, proses bisnis, dan lowongan kerja","Domain, DNS server, mail server, dan alamat IP server utama","Domain cookie, path cookie, expiry cookie, dan HttpOnly flag"],"answer":2},{"id":"STSI4405-28","question":"Dalam alur sesi web pada materi, server telah memberi session ID kepada klien. Apa yang kemudian dilakukan klien saat mengajukan permintaan berikutnya?","explanation":"Materi menjelaskan server memberikan session ID kepada klien, lalu klien menyebutkan ID itu pada permintaan berikutnya.","topic":"Cookie dan sesi web","level":"Penerapan","source":{"file":"Sesi4_Eksploitasi-Keamanan-Sistem-Informasi.pdf","session":4,"page":8},"options":["Menyebutkan session ID pada subsequent request","Mengganti session ID dengan tipe enkripsi WPA2","Menghilangkan identitas sesi dari semua permintaan berikutnya","Mengubah session ID menjadi nama domain DNS"],"answer":0},{"id":"STSI4405-29","question":"Sebuah unit ingin melakukan monitoring dan filtering serta meningkatkan kinerja melalui perantara jaringan. Teknologi yang alasan penggunaannya mencakup kebutuhan itu dalam materi adalah ...","explanation":"Materi mencantumkan monitoring and filtering serta improving performance sebagai alasan menggunakan proxy.","topic":"Fungsi proxy","level":"Penerapan","source":{"file":"Sesi4_Eksploitasi-Keamanan-Sistem-Informasi.pdf","session":4,"page":9},"options":["Caesar Cipher","Service Set Identifier","Proxy","Digital signature"],"answer":2},{"id":"STSI4405-30","question":"Saat meninjau aplikasi web, tim menemukan masukan pengguna dimanfaatkan tanpa proses sanitasi. Materi menghubungkan kondisi ini dengan kemungkinan terjadinya ...","explanation":"Materi menyatakan perintah SQL berbahaya dapat masuk apabila masukan pengguna tidak melalui sanitasi terlebih dahulu.","topic":"Akar kelemahan SQL injection","level":"Penerapan","source":{"file":"Sesi5_Eksploitasi-Keamanan-Sistem-Informasi-2.pdf","session":5,"page":3},"options":["Pembentukan diagram topologi","Pengelolaan sertifikat digital","Normalisasi data log","SQL injection"],"answer":3},{"id":"STSI4405-31","question":"Penilaian risiko hanya mencatat SQL injection sebagai perubahan isi database. Mengapa penilaian itu perlu diperluas menurut materi?","explanation":"Materi menjelaskan dampak SQL injection dapat melebihi manipulasi database, termasuk menghabiskan resource dan mencuri data kredensial.","topic":"Dampak SQL injection","level":"Analisis","source":{"file":"Sesi5_Eksploitasi-Keamanan-Sistem-Informasi-2.pdf","session":5,"page":2},"options":["Dampaknya terbatas pada perubahan warna tampilan situs","Serangan ini hanya memengaruhi nama access point","Dampaknya dapat mencakup habisnya resource database dan pencurian data kredensial","Serangan ini selalu berhenti sebelum menyentuh data pengguna"],"answer":2},{"id":"STSI4405-32","question":"Aplikasi menampilkan pesan kesalahan yang mengungkap sistem database dan lokasi file kode. Mengapa temuan ini perlu diperhatikan menurut materi?","explanation":"Materi menjelaskan pesan error dapat mengungkap sistem database dan lokasi kode, yang kemudian berguna untuk memanfaatkan celah.","topic":"Pengungkapan informasi melalui error","level":"Analisis","source":{"file":"Sesi5_Eksploitasi-Keamanan-Sistem-Informasi-2.pdf","session":5,"page":5},"options":["Pesan itu membuktikan seluruh input sudah disanitasi dengan benar","Informasi itu dapat membantu pihak tidak berwenang memanfaatkan celah sistem","Pesan itu hanya menunjukkan perubahan standar jaringan nirkabel","Informasi itu otomatis membatalkan semua hak akses pengguna"],"answer":1},{"id":"STSI4405-33","question":"Laporan menyimpulkan aplikasi pasti bebas SQL injection hanya karena tidak menampilkan pesan error. Penilaian yang sesuai materi adalah ...","explanation":"Bagian blind SQL injection membahas kondisi pesan error tidak tampil dan pengujian masih dilanjutkan. Ketiadaan pesan error saja belum memadai sebagai bukti bebas kelemahan.","topic":"Penilaian blind SQL injection","level":"Analisis","source":{"file":"Sesi5_Eksploitasi-Keamanan-Sistem-Informasi-2.pdf","session":5,"page":6},"options":["Tidak adanya error membuktikan seluruh cookie berada di server","Kesimpulan belum cukup karena materi membahas blind SQL injection ketika pesan error tidak tampil","Tidak adanya error membuktikan seluruh data telah dienkripsi","Kesimpulan pasti benar karena SQL injection selalu memerlukan pesan error"],"answer":1},{"id":"STSI4405-34","question":"Tim meninjau gangguan fungsi aplikasi yang dipicu masukan pengguna berbahaya. Kelemahan pengamanan terkait XSS pada kondisi itu menurut materi adalah ...","explanation":"Materi menyebut XSS sebagai serangan yang dipicu input pengguna dan mengaitkan gangguan fungsi dengan validasi yang tidak memadai.","topic":"Validasi input dan XSS","level":"Penerapan","source":{"file":"Sesi5_Eksploitasi-Keamanan-Sistem-Informasi-2.pdf","session":5,"page":7},"options":["Tidak tersedianya proses validasi input yang memadai","Pencatatan sumber data log dalam format umum","Pengelolaan sertifikat melalui certificate authority","Penggunaan diagram topologi fisik secara teratur"],"answer":0},{"id":"STSI4405-35","question":"Konten berbahaya tersimpan pada aplikasi dan kemudian dieksekusi di browser pengguna yang mengunjungi halaman rentan. Tipe XSS yang sesuai materi adalah ...","explanation":"Persistent XSS dijelaskan menyimpan kode pada aplikasi dan dapat memicu eksekusi saat halaman dikunjungi pengguna. Ciri penyimpanan membedakannya dari reflected XSS.","topic":"Persistent XSS","level":"Analisis","source":{"file":"Sesi5_Eksploitasi-Keamanan-Sistem-Informasi-2.pdf","session":5,"page":10},"options":["Gangguan ketersediaan jaringan nirkabel","SQL injection berbasis pesan error","Persistent XSS","Reflected XSS"],"answer":2},{"id":"STSI4405-36","question":"XSS ketika korban tanpa sadar memasukkan payload ke dalam HTTP request yang dikirim ke website rentan disebut ...","explanation":"Materi mendefinisikan reflected XSS sebagai kondisi korban tanpa sadar memasukkan payload ke HTTP request menuju website rentan. Istilah non-persistent dicantumkan sebagai padanannya.","topic":"Reflected XSS","level":"Pemahaman","source":{"file":"Sesi5_Eksploitasi-Keamanan-Sistem-Informasi-2.pdf","session":5,"page":10},"options":["Reflected XSS atau non-persistent XSS","Persistent XSS","Public Key Infrastructure","Cipher Block Chaining"],"answer":0},{"id":"STSI4405-37","question":"Kampus memilih WiFi karena area sulit dipasangi kabel, tetapi jumlah komputer diperkirakan terus bertambah. Pasangan pertimbangan yang sesuai materi adalah ...","explanation":"Materi menyebut kemudahan koneksi di area sulit dipasangi kabel sebagai keuntungan WiFi. Bertambahnya komputer dalam jaringan dinamis dapat mengurangi bandwidth dan menyulitkan perencanaan.","topic":"Karakteristik WiFi","level":"Analisis","source":{"file":"Sesi6_Teknologi-Pengamanan-Perangkat-Jaringan-Nirkabel-dan-Email.pdf","session":6,"page":2},"options":["Kemudahan konektivitas di area sulit dipasangi kabel, disertai potensi penurunan bandwidth saat komputer bertambah","Standar perangkat yang tak pernah berubah, disertai hilangnya kebutuhan perencanaan","Jangkauan akses tak terbatas, disertai tidak adanya gangguan elektronik","Kewajiban memasang kabel pada setiap klien, disertai bandwidth yang selalu meningkat"],"answer":0},{"id":"STSI4405-38","question":"Istilah yang menurut materi menunjukkan identitas sebuah WLAN adalah ...","explanation":"SSID dijelaskan sebagai komponen untuk menunjukkan identitas WLAN. Cell berkaitan dengan wilayah cakupan, sedangkan BTS dan WLC merupakan istilah perangkat atau pengelolaan jaringan.","topic":"Identitas WLAN","level":"Pemahaman","source":{"file":"Sesi6_Teknologi-Pengamanan-Perangkat-Jaringan-Nirkabel-dan-Email.pdf","session":6,"page":3},"options":["Service Set Identifier atau SSID","Cell","Wireless Controller atau WLC","Base Transceiver Station atau BTS"],"answer":0},{"id":"STSI4405-39","question":"Organisasi memerlukan sistem manajemen otentikasi dan otorisasi terpusat untuk jaringan nirkabel. Istilah yang sesuai materi adalah ...","explanation":"Materi mendefinisikan RADIUS sebagai sistem manajemen otentikasi dan otorisasi terpusat. Pilihan lainnya dijelaskan dalam konteks mekanisme keamanan atau enkripsi nirkabel.","topic":"Otentikasi terpusat","level":"Penerapan","source":{"file":"Sesi6_Teknologi-Pengamanan-Perangkat-Jaringan-Nirkabel-dan-Email.pdf","session":6,"page":5},"options":["CCMP","RADIUS","WEP","TKIP"],"answer":1},{"id":"STSI4405-40","question":"Pasangan yang dinyatakan digunakan WPA2 untuk enkripsi data nirkabel dalam materi adalah ...","explanation":"Materi menuliskan WPA2 menggunakan AES 128 bit dan CCMP untuk enkripsi data nirkabel. Jawaban mengikuti pasangan yang dinyatakan sumber.","topic":"Enkripsi WPA2","level":"Pemahaman","source":{"file":"Sesi6_Teknologi-Pengamanan-Perangkat-Jaringan-Nirkabel-dan-Email.pdf","session":6,"page":5},"options":["TKIP dan enkripsi Caesar","WEP dan hash MD4","RSA dan Electronic Code Book","AES 128 bit dan CCMP"],"answer":3},{"id":"STSI4405-41","question":"Petugas menilai insiden ketika informasi rahasia yang dikirim melalui koneksi nirkabel dicegat. Berdasarkan pengelompokan materi, aspek utama yang diserang adalah ...","explanation":"Materi menyebut serangan kerahasiaan sebagai upaya mencegat informasi rahasia yang dikirim secara nirkabel. Kasus berfokus pada penyadapan tersebut.","topic":"Kerahasiaan jaringan nirkabel","level":"Analisis","source":{"file":"Sesi6_Teknologi-Pengamanan-Perangkat-Jaringan-Nirkabel-dan-Email.pdf","session":6,"page":8},"options":["Pemeliharaan perangkat","Ketersediaan","Perencanaan infrastruktur","Kerahasiaan"],"answer":3},{"id":"STSI4405-42","question":"Gangguan WLAN bertujuan mencegah pengguna sah mengakses sumber daya jaringan. Menurut materi, tujuan itu merupakan serangan terhadap ...","explanation":"Materi mendeskripsikan serangan ketersediaan atau DoS sebagai upaya mencegah pengguna sah mengakses sumber daya nirkabel.","topic":"Ketersediaan jaringan nirkabel","level":"Penerapan","source":{"file":"Sesi6_Teknologi-Pengamanan-Perangkat-Jaringan-Nirkabel-dan-Email.pdf","session":6,"page":9},"options":["Keaslian tanda tangan digital","Identitas nama SSID","Kerahasiaan pesan","Ketersediaan"],"answer":3},{"id":"STSI4405-43","question":"Pencurian informasi dari perangkat nirkabel melalui koneksi Bluetooth disebut apa dalam materi?","explanation":"BlueSnarfing didefinisikan sebagai pencurian informasi melalui Bluetooth. Bluejacking berkaitan dengan pesan yang tidak diminta, sedangkan BlueSmacking merupakan DoS.","topic":"Ancaman Bluetooth","level":"Pemahaman","source":{"file":"Sesi6_Teknologi-Pengamanan-Perangkat-Jaringan-Nirkabel-dan-Email.pdf","session":6,"page":11},"options":["BlueSnarfing","Bluejacking","BlueSniff","BlueSmacking"],"answer":0},{"id":"STSI4405-44","question":"Kegiatan inti organisasi dalam kerangka Information Security Management System menurut materi adalah ...","explanation":"ISMS dijelaskan sebagai kerangka manajemen tempat organisasi mengidentifikasi, menganalisis, dan menangani risiko keamanan informasi.","topic":"ISMS","level":"Pemahaman","source":{"file":"Sesi7_Audit-Keamanan-SI.pdf","session":7,"page":2},"options":["Menghapus seluruh kebijakan agar pengelolaan lebih sederhana","Hanya memeriksa tampilan aplikasi tanpa proses manajemen","Mengidentifikasi, menganalisis, dan menangani risiko keamanan informasi","Hanya memasang perangkat jaringan tanpa menilai risiko"],"answer":2},{"id":"STSI4405-45","question":"Organisasi sedang memahami tujuan bisnis, menetapkan ruang lingkup, dan menilai risiko sebelum implementasi. Tahap ISO 27001 berbasis PDCA yang sesuai materi adalah ...","explanation":"Materi menempatkan pemahaman tujuan bisnis, penentuan ruang lingkup, dan penilaian risiko pada tahap Plan. Aktivitas tersebut mendahului implementasi rencana.","topic":"Tahap Plan pada PDCA","level":"Penerapan","source":{"file":"Sesi7_Audit-Keamanan-SI.pdf","session":7,"page":4},"options":["Do","Plan","Check","Act"],"answer":1},{"id":"STSI4405-46","question":"Tim A memantau implementasi dan menyusun laporan. Tim B mengambil tindakan korektif dan meningkatkan proses. Pasangan tahap PDCA yang sesuai materi adalah ...","explanation":"Pemantauan implementasi dan penyusunan laporan ditempatkan pada Check. Peningkatan proses serta tindakan korektif ditempatkan pada Act.","topic":"Tahap Check dan Act","level":"Analisis","source":{"file":"Sesi7_Audit-Keamanan-SI.pdf","session":7,"page":4},"options":["Tim A menjalankan Check dan tim B menjalankan Act","Tim A menjalankan Do dan tim B menjalankan Plan","Tim A menjalankan Act dan tim B menjalankan Check","Tim A menjalankan Plan dan tim B menjalankan Do"],"answer":0},{"id":"STSI4405-47","question":"Menurut NIST Cybersecurity Framework pada materi, kegiatan yang dikembangkan untuk mengidentifikasi terjadinya peristiwa keamanan siber termasuk fungsi ...","explanation":"Detect dijelaskan sebagai kegiatan untuk mengidentifikasi terjadinya peristiwa keamanan siber. Identify pada materi berfokus pada pemahaman organisasi dalam mengelola risiko.","topic":"Fungsi Detect dalam NIST","level":"Penerapan","source":{"file":"Sesi7_Audit-Keamanan-SI.pdf","session":7,"page":5},"options":["Recover","Detect","Identify","Protect"],"answer":1},{"id":"STSI4405-48","question":"Setelah insiden, organisasi berfokus pada pemulihan layanan yang terganggu dan mempertahankan rencana ketahanan. Fungsi pada materi yang sesuai adalah ...","explanation":"Materi menghubungkan Recover dengan rencana ketahanan serta pemulihan kemampuan atau layanan yang terganggu akibat peristiwa keamanan siber.","topic":"Fungsi Recover dalam NIST","level":"Penerapan","source":{"file":"Sesi7_Audit-Keamanan-SI.pdf","session":7,"page":5},"options":["Identify","Detect","Recover","Protect"],"answer":2},{"id":"STSI4405-49","question":"Auditor membutuhkan peta visual komponen jaringan dan bagaimana komponen tersebut terhubung. Dokumentasi yang disebut wajib dalam materi adalah ...","explanation":"Materi menyebut diagram topologi sebagai dokumentasi wajib dan peta visual keterhubungan jaringan. Dua jenisnya ialah topologi fisik dan logik.","topic":"Dokumentasi topologi jaringan","level":"Penerapan","source":{"file":"Sesi7_Audit-Keamanan-SI.pdf","session":7,"page":7},"options":["Diagram topologi fisik dan logik","Daftar tanggal kedaluwarsa PGP key saja","Daftar pertanyaan rahasia akun saja","Daftar pemilik sertifikat tanpa hubungan jaringan"],"answer":0},{"id":"STSI4405-50","question":"Tim menerima log keamanan dari sejumlah sumber dengan format berbeda dan ingin menggabungkannya ke format umum sebelum ditambahkan ke Elasticsearch. Proses serta alat yang sesuai materi adalah ...","explanation":"Normalisasi dijelaskan sebagai penggabungan data berbagai sumber ke format umum. Logstash menyediakan transformasi untuk mengolah data keamanan sebelum menambahkannya ke Elasticsearch.","topic":"Normalisasi data log","level":"Analisis","source":{"file":"Sesi7_Audit-Keamanan-SI.pdf","session":7,"page":11},"options":["Data reduction dengan membuang seluruh log","Normalisasi data menggunakan transformasi Logstash","Enkripsi log menggunakan otentikasi terbuka","Penggantian semua log dengan SSID"],"answer":1}]},{"code":"STSI4407","name":"Manajemen Layanan Teknologi Informasi","reference":"Kode bahan ajar pada katalog UT: MSIM4407, Manajemen Layanan Teknologi Informasi.","coverage":"Materi Tuton sesi 1–8.","note":"","questions":[{"id":"STSI4407-01","question":"Organisasi ingin mengukur dan mengendalikan infrastruktur TI agar layanan berkualitas sekaligus hemat biaya. Menurut materi Tuton, pendekatan yang paling sesuai adalah …","explanation":"ITSM memungkinkan organisasi mengukur, mengendalikan, dan mengelola infrastruktur TI untuk memberikan layanan berkualitas tinggi serta hemat biaya.","topic":"Tujuan ITSM","level":"Penerapan","source":{"file":"Inisiasi1_ManajemenLayananSI.pdf","session":1,"page":3},"options":["pengadaan perangkat saja tanpa pengelolaan proses layanan","pemindahan seluruh tanggung jawab layanan kepada pengguna","ITSM yang menghubungkan tanggung jawab, disiplin, dan proses layanan","pengukuran jumlah perangkat tanpa memperhatikan kebutuhan organisasi"],"answer":2},{"id":"STSI4407-02","question":"Kepala unit menyepakati target tingkat layanan, sedangkan staf memakai aplikasi setiap hari. Menurut materi Tuton, pembagian yang tepat ialah …","explanation":"Customer mendefinisikan serta menyetujui target service level. User menggunakan layanan setiap hari dan dapat berbeda dari customer.","topic":"Customer dan user","level":"Penerapan","source":{"file":"Inisiasi1_ManajemenLayananSI.pdf","session":1,"page":4},"options":["kepala unit sebagai supplier dan staf sebagai customer","kepala unit sebagai user hanya karena menyetujui target","kepala unit dan staf harus selalu dianggap supplier","kepala unit sebagai customer dan staf sebagai user"],"answer":3},{"id":"STSI4407-03","question":"Dua penyedia memiliki perangkat serupa, tetapi salah satunya lebih mampu mengoordinasikan dan mengendalikan sumber dayanya. Menurut materi Tuton, keunggulan itu menunjukkan …","explanation":"Capabilities adalah kemampuan mengoordinasikan, mengontrol, dan menyebarkan resource untuk menghasilkan nilai.","topic":"Resource dan capability","level":"Penerapan","source":{"file":"Inisiasi1_ManajemenLayananSI.pdf","session":1,"page":7},"options":["capabilities yang digunakan untuk mengelola resource agar menghasilkan nilai","bertambahnya jumlah perangkat sebagai satu-satunya aset layanan","resource sebagai input produksi tanpa kemampuan pengelolaan","penggantian seluruh kemampuan organisasi dengan modal keuangan"],"answer":0},{"id":"STSI4407-04","question":"Sebuah tim beserta alatnya menjalankan proses layanan, sementara seorang anggota merangkap tanggung jawab manajer perubahan dan konfigurasi. Menurut materi Tuton, pembagian konsep yang tepat ialah …","explanation":"Fungsi terdiri atas tim atau kelompok orang beserta alat atau sumber daya untuk melaksanakan proses. Peran memuat tanggung jawab, aktivitas, dan wewenang, dan satu orang dapat memiliki beberapa peran.","topic":"Peran dan fungsi","level":"Analisis","source":{"file":"Inisiasi1_ManajemenLayananSI.pdf","session":1,"page":11},"options":["tim dan alat merupakan peran, sedangkan tanggung jawab anggota hanya boleh satu fungsi","tim dan alat merupakan fungsi, sedangkan tanggung jawab anggota merupakan peran yang dapat dirangkap","tim dan alat merupakan input keuangan, sedangkan seluruh tanggung jawab anggota merupakan layanan","tim dan alat merupakan keluaran layanan, sedangkan rangkap tanggung jawab selalu dilarang"],"answer":1},{"id":"STSI4407-05","question":"Pengguna bingung harus menghubungi siapa saat layanan terganggu atau ketika meminta layanan standar. Menurut materi Tuton, fungsi yang menjadi titik kontak tunggal adalah …","explanation":"Service desk merupakan titik kontak tunggal pengguna ketika terjadi gangguan layanan maupun untuk permintaan layanan.","topic":"Service desk","level":"Penerapan","source":{"file":"Inisiasi1_ManajemenLayananSI.pdf","session":1,"page":12},"options":["application management untuk mengganti semua kegiatan komunikasi pengguna","IT operations management untuk menetapkan harga seluruh layanan","technical management untuk menyusun seluruh kontrak pelanggan","service desk untuk menerima gangguan dan permintaan layanan pengguna"],"answer":3},{"id":"STSI4407-06","question":"Penyedia mengelola layanan yang masih dikembangkan, layanan yang ditawarkan, dan layanan yang dihentikan. Menurut materi Tuton, keseluruhan kumpulan itu merupakan …","explanation":"Service portfolio adalah rangkaian lengkap layanan yang dikelola penyedia. Pipeline, catalogue, dan retired service merupakan bagian yang berbeda di dalamnya.","topic":"Portfolio dan catalogue","level":"Analisis","source":{"file":"Inisiasi1_ManajemenLayananSI.pdf","session":1,"page":12},"options":["service portfolio yang mencakup seluruh komitmen dan investasi layanan","retired service yang berisi semua layanan yang masih beroperasi","service pipeline yang hanya memuat layanan yang telah dihentikan","service catalogue yang hanya berisi seluruh rencana layanan masa depan"],"answer":0},{"id":"STSI4407-07","question":"Sebuah penyedia harus menentukan investasi layanan mana yang didahulukan untuk mendukung pengembangan jangka panjang. Dalam siklus ITIL pada materi Tuton, kegiatan ini terutama berada pada …","explanation":"Service strategy memberikan panduan untuk menjelaskan dan memprioritaskan investasi penyedia dalam memberikan layanan.","topic":"Service strategy","level":"Penerapan","source":{"file":"Inisiasi2_ManajemenLayananSI.pdf","session":2,"page":2},"options":["release deployment yang memasang paket rilis ke lingkungan nyata","incident management yang memulihkan gangguan operasional saat ini","service strategy yang memandu prioritas investasi penyedia layanan","access management yang mengatur hak pengguna pada sistem"],"answer":2},{"id":"STSI4407-08","question":"Sistem menyediakan fungsi yang dibutuhkan pengguna, tetapi sering tidak tersedia ketika diperlukan. Menurut pasangan konsep nilai layanan dalam materi Tuton, aspek yang terutama perlu ditinjau ialah …","explanation":"Garansi memastikan utilitas layanan tersedia sesuai kebutuhan dengan kapasitas, kontinuitas, dan keamanan yang memadai. Fungsi sudah sesuai, tetapi ketersediaan penggunaannya masih bermasalah.","topic":"Utility dan warranty","level":"Analisis","source":{"file":"Inisiasi2_ManajemenLayananSI.pdf","session":2,"page":6},"options":["warranty atau kesesuaian untuk digunakan","perbedaan pelanggan internal dengan pelanggan eksternal","utility atau kesesuaian fungsi untuk tujuan yang dibutuhkan","penentuan nilai layanan hanya dari harga perangkat"],"answer":0},{"id":"STSI4407-09","question":"Penyedia menilai konsistensi rangkaian keputusan dan tindakannya dari waktu ke waktu. Menurut Four Ps pada materi Tuton, perhatian itu paling sesuai dengan …","explanation":"Patterns menggambarkan rangkaian keputusan dan tindakan yang konsisten dari waktu ke waktu.","topic":"Four Ps of strategy","level":"Penerapan","source":{"file":"Inisiasi2_ManajemenLayananSI.pdf","session":2,"page":11},"options":["patterns sebagai rangkaian keputusan dan tindakan yang konsisten","perspective sebagai penetapan filosofi serta arah organisasi","position sebagai keputusan untuk mengadopsi sikap yang jelas","peralihan kondisi saat ini menuju keadaan baru yang direncanakan"],"answer":0},{"id":"STSI4407-10","question":"Sebuah layanan sudah tidak beroperasi, tetapi informasinya tetap disimpan untuk digunakan kemudian. Menurut materi Tuton, status layanan tersebut adalah …","explanation":"Retired services adalah layanan yang tidak lagi beroperasi. Informasinya tetap didokumentasikan dalam service portfolio.","topic":"Retired services","level":"Penerapan","source":{"file":"Inisiasi2_ManajemenLayananSI.pdf","session":2,"page":14},"options":["retired service yang tetap didokumentasikan dalam portfolio","layanan aktif yang harus selalu tersedia untuk kontrak baru","service pipeline yang sudah siap ditawarkan kepada seluruh pengguna","service catalogue yang semata-mata berisi usulan investasi"],"answer":0},{"id":"STSI4407-11","question":"Perusahaan membayar biaya tertentu sekalipun layanan sama sekali tidak digunakan pada suatu bulan. Menurut klasifikasi biaya dalam materi Tuton, biaya ini termasuk …","explanation":"Biaya tetap harus dibayar terlepas dari penggunaan produk atau jasa.","topic":"Klasifikasi biaya","level":"Penerapan","source":{"file":"Inisiasi2_ManajemenLayananSI.pdf","session":2,"page":17},"options":["biaya tetap karena pembayarannya terlepas dari penggunaan","biaya variabel karena nilainya selalu mengikuti pemakaian aktual","biaya capital hanya karena pemakaiannya sedang berhenti","biaya langsung hanya karena dibayarkan secara bulanan"],"answer":0},{"id":"STSI4407-12","question":"Penyedia membedakan tarif pada waktu tertentu agar permintaan tidak menumpuk pada jam puncak. Menurut materi Tuton, teknik yang digunakan ialah …","explanation":"Differential charging mengenakan biaya lebih atau kurang untuk menyeimbangkan permintaan maupun mengurangi permintaan puncak.","topic":"Demand management","level":"Penerapan","source":{"file":"Inisiasi2_ManajemenLayananSI.pdf","session":2,"page":19},"options":["pemberian akses tanpa batas untuk menaikkan jumlah pengguna serentak","differential charging untuk memengaruhi dan menyeimbangkan permintaan","pencatatan retired service untuk menghapus semua permintaan pengguna","validasi paket rilis untuk memastikan kesesuaian hasil pengujian"],"answer":1},{"id":"STSI4407-13","question":"Manajer rutin berdiskusi dengan pelanggan untuk memahami kebutuhan bisnis dan menemukan peluang pelayanan yang lebih baik. Menurut materi Tuton, proses utamanya ialah …","explanation":"Business relationship management membangun serta memelihara hubungan bisnis berdasarkan pemahaman pelanggan dan kebutuhan bisnis mereka.","topic":"Business relationship management","level":"Penerapan","source":{"file":"Inisiasi2_ManajemenLayananSI.pdf","session":2,"page":20},"options":["incident management untuk menutup laporan gangguan pengguna","business relationship management untuk memelihara hubungan bisnis pelanggan","configuration management untuk memberi label pada aset layanan","release management untuk menjadwalkan paket yang akan dipasang"],"answer":1},{"id":"STSI4407-14","question":"Informasi layanan tersebar pada beberapa dokumen dan saling bertentangan. Menurut materi Tuton, pengelolaan katalog layanan perlu menyediakan …","explanation":"Tujuan pengelolaan katalog adalah menyediakan sumber tunggal informasi layanan yang disetujui secara konsisten dan tersedia bagi pihak berkepentingan.","topic":"Service catalogue management","level":"Penerapan","source":{"file":"Inisiasi3_ManajemenLayananSI.pdf","session":3,"page":14},"options":["salinan informasi terpisah yang boleh berubah tanpa koordinasi","dokumen layanan yang hanya dapat dipakai setelah layanan dihentikan","daftar perangkat saja tanpa rincian atau status layanan","sumber tunggal informasi layanan yang konsisten dan mudah diakses pihak berkepentingan"],"answer":3},{"id":"STSI4407-15","question":"Penyedia membandingkan performa operasional dengan target dalam SLA. Menurut materi Tuton, kegiatan ini merupakan bagian dari …","explanation":"SLM memantau serta mengukur performa dan capaian operasional layanan terhadap target dalam SLA.","topic":"Service level management","level":"Penerapan","source":{"file":"Inisiasi3_ManajemenLayananSI.pdf","session":3,"page":15},"options":["service pipeline untuk menentukan peluang investasi baru","knowledge management untuk menghapus data pengukuran yang lama","supplier management untuk mengganti seluruh kontrak pemasok","service level management untuk memantau capaian layanan terhadap kesepakatan"],"answer":3},{"id":"STSI4407-16","question":"Organisasi memperkirakan pertumbuhan transaksi dan memperbarui rencana sumber daya agar layanan tetap memenuhi kebutuhan mendatang. Menurut materi Tuton, proses yang paling relevan adalah …","explanation":"Manajemen kapasitas memproduksi dan merawat rencana kapasitas yang sesuai kebutuhan bisnis dalam jangka dekat maupun panjang.","topic":"Capacity management","level":"Penerapan","source":{"file":"Inisiasi3_ManajemenLayananSI.pdf","session":3,"page":17},"options":["release closure untuk mengakhiri implementasi , proses ini ialah …","explanation":"Manajemen pemasok menjaga kualitas layanan pemasok agar selaras dengan nilai bisnis organisasi, termasuk memantau kinerja dan menegosiasikan kontrak.","topic":"Supplier management","level":"Penerapan","source":{"file":"Inisiasi3_ManajemenLayananSI.pdf","session":3,"page":26},"options":["capacity management yang hanya menilai performa infrastruktur","service validation yang semata-mata menguji paket perubahan baru","incident management yang hanya melakukan pemulihan gangguan","supplier management yang mengelola pemasok beserta layanan dan kontraknya"],"answer":3},{"id":"STSI4407-20","question":"Sebuah perubahan berisiko rendah, tidak kompleks, berulang, dan sudah memiliki prosedur baku. Menurut materi Tuton, perubahan itu diklasifikasikan sebagai …","explanation":"Standard change bersifat rutin, berisiko rendah, tidak kompleks, dan dapat berulang sehingga mengikuti prosedur yang sudah ditetapkan.","topic":"Jenis perubahan","level":"Penerapan","source":{"file":"Inisiasi4_ManajemenLayananSI.pdf","session":4,"page":6},"options":["standard change yang cukup mengikuti prosedur yang telah ditetapkan","major incident yang selalu menurunkan kualitas layanan yang berjalan","normal change yang tidak termasuk perubahan standar maupun darurat","emergency change yang selalu membutuhkan implementasi darurat"],"answer":0},{"id":"STSI4407-21","question":"Pegawai ingin mengajukan perubahan layanan secara resmi melalui dokumen fisik atau digital. Menurut materi Tuton, dokumen yang disiapkan ialah …","explanation":"RFC merupakan dokumen resmi pengajuan perubahan dan dapat berbentuk fisik maupun digital.","topic":"Request for change","level":"Penerapan","source":{"file":"Inisiasi4_ManajemenLayananSI.pdf","session":4,"page":7},"options":["dokumen penutupan insiden sebagai persetujuan pemulihan gangguan","Request for Change sebagai dokumen resmi pengajuan perubahan","Service Catalogue sebagai daftar layanan yang tersedia bagi pelanggan","CSI Register sebagai pencatatan semua peluang peningkatan layanan"],"answer":1},{"id":"STSI4407-22","question":"Tim tidak hanya mencatat aset bernilai keuangan, tetapi juga hubungan aset dengan layanan TI yang didukungnya. Menurut materi Tuton, fokus ini sesuai dengan …","explanation":"Manajemen konfigurasi mencatat aset layanan tertentu, tidak terbatas pada nilai keuangan, dan menggambarkan relasi aset dengan layanan TI.","topic":"Configuration management","level":"Penerapan","source":{"file":"Inisiasi4_ManajemenLayananSI.pdf","session":4,"page":10},"options":["manajemen permintaan yang hanya menyeimbangkan beban jam puncak","manajemen hubungan bisnis yang hanya mengukur kepuasan pelanggan","manajemen aset yang terbatas pada pelaporan biaya langganan pelanggan","manajemen konfigurasi yang mencatat aset serta model relasi dengan layanan"],"answer":3},{"id":"STSI4407-23","question":"Perusahaan memasang perubahan layanan pada beberapa area dengan waktu penerapan yang berbeda. Menurut materi Tuton, metode ini ialah …","explanation":"Phased approach menerapkan perubahan pada area berbeda dalam waktu yang berbeda pula.","topic":"Metode deployment","level":"Penerapan","source":{"file":"Inisiasi4_ManajemenLayananSI.pdf","session":4,"page":11},"options":["pull yang ditentukan semata-mata oleh inisiatif setiap pengguna","manual yang selalu berarti semua area harus dipasang sekaligus","phased approach yang menerapkan perubahan secara bertahap antararea","big bang yang memasang perubahan ke seluruh target dalam satu waktu"],"answer":2},{"id":"STSI4407-24","question":"Sebelum layanan baru masuk lingkungan sesungguhnya, tim mencari bukti objektif bahwa layanan memenuhi tingkat layanan yang disepakati. Menurut materi Tuton, proses yang dibutuhkan adalah …","explanation":"Validasi dan pengujian terstruktur menyediakan bukti objektif bahwa layanan baru sesuai tingkat layanan dalam SLA.","topic":"Service validation and testing","level":"Penerapan","source":{"file":"Inisiasi4_ManajemenLayananSI.pdf","session":4,"page":12},"options":["service retirement untuk menghapus layanan baru dari portfolio","incident closure untuk menutup gangguan operasional terdahulu","service validation and testing melalui pengujian yang terstruktur","differential charging untuk meratakan beban pelanggan"],"answer":2},{"id":"STSI4407-25","question":"Pengetahuan tim transisi dibagikan kepada staf yang membutuhkannya melalui pelatihan dan seminar. Menurut materi Tuton, aktivitas ini termasuk …","explanation":"Transfer pengetahuan menyampaikan pengetahuan dari pemiliknya kepada orang yang membutuhkannya melalui berbagai media, termasuk pelatihan dan seminar.","topic":"Knowledge management","level":"Penerapan","source":{"file":"Inisiasi4_ManajemenLayananSI.pdf","session":4,"page":14},"options":["otorisasi perubahan untuk menggantikan semua pengujian","kontrol konfigurasi untuk mengubah label aset layanan","transfer pengetahuan kepada orang yang tepat membutuhkannya","penghapusan pengetahuan untuk mengurangi informasi di SKMS"],"answer":2},{"id":"STSI4407-26","question":"Pemantauan menemukan suatu nilai mencapai ambang batas sehingga tindakan pencegahan perlu dipertimbangkan. Menurut materi Tuton, event ini termasuk …","explanation":"Warning adalah event yang nilainya mencapai ambang batas dan informasinya digunakan untuk mempertimbangkan tindakan pencegahan potensi kegagalan.","topic":"Klasifikasi event","level":"Penerapan","source":{"file":"Inisiasi5_ManajemenLayananSI.pdf","session":5,"page":5},"options":["exception yang berarti layanan pasti sudah berjalan secara abnormal","retired service yang menandakan layanan tidak lagi dioperasikan","information yang selalu menunjukkan kondisi normal tanpa kebutuhan tindakan","warning yang menunjukkan perlunya mempertimbangkan tindakan pencegahan"],"answer":3},{"id":"STSI4407-27","question":"Layanan berulang kali terganggu. Satu tim memulihkan gejala gangguan, sedangkan tim lain mencari akar penyebabnya. Menurut materi Tuton, pembagian tersebut
