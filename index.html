men ini ialah …","explanation":"CSI register adalah basis data atau dokumen terstruktur untuk mengelola peluang perbaikan beserta informasi pendukungnya.","topic":"CSI register","level":"Penerapan","source":{"file":"Inisiasi6_ManajemenLayananSI.pdf","session":6,"page":7},"options":["RFC yang selalu menjadi laporan akhir pemulihan insiden","retired service list yang hanya berisi rencana investasi baru","service catalogue yang semata-mata berisi target pengujian","CSI register untuk mencatat dan mengelola peluang peningkatan"],"answer":3},{"id":"STSI4407-36","question":"Tim mengukur kecepatan loading layanan situs secara menyeluruh dari sudut pandang pengguna. Menurut materi Tuton, pengukuran tersebut termasuk …","explanation":"Service metrics mengukur kualitas keseluruhan layanan dari sudut pandang pengguna; kecepatan loading website merupakan salah satu contohnya.","topic":"Jenis metrics CSI","level":"Analisis","source":{"file":"Inisiasi6_ManajemenLayananSI.pdf","session":6,"page":7},"options":["service metrics yang menilai performa end-to-end layanan","financial metrics yang hanya menghitung biaya capital aset","technology metrics yang terbatas pada unjuk kerja satu komponen","process metrics yang hanya menghitung insiden yang ditangani"],"answer":0},{"id":"STSI4407-37","question":"Organisasi ingin mengurangi variasi proses dan meminimalkan cacat hingga mendekati nol. Menurut metodologi CSI dalam materi Tuton, pendekatan yang paling sesuai ialah …","explanation":"Materi menggambarkan Six Sigma sebagai metode meminimalkan cacat dan berfokus pada pengurangan variasi di seluruh proses.","topic":"Six Sigma pada CSI","level":"Penerapan","source":{"file":"Inisiasi6_ManajemenLayananSI.pdf","session":6,"page":8},"options":["Balanced Scorecard yang semata-mata menghapus sasaran organisasi","service catalogue yang hanya mencatat layanan tersedia","request fulfillment yang hanya menyediakan layanan standar","Six Sigma yang berfokus pada pengurangan variasi proses"],"answer":3},{"id":"STSI4407-38","question":"Sesudah data dikumpulkan dan diproses, tim menganalisis tren serta mengevaluasi tercapainya target. Menurut pemetaan PDCA pada materi Tuton, aktivitas ini berada pada tahap …","explanation":"Tahap Check mencakup analisis tren data, pencapaian target, dan kebutuhan perbaikan. Penerapan tindakan peningkatan berada pada Act.","topic":"PDCA dalam CSI","level":"Penerapan","source":{"file":"Inisiasi6_ManajemenLayananSI.pdf","session":6,"page":11},"options":["Do untuk mengumpulkan serta memproses data pengukuran","Check untuk menganalisis informasi dan mengevaluasi kebutuhan perbaikan","Act untuk menerapkan tindakan peningkatan atau koreksi","Plan untuk menentukan strategi dan apa yang akan diukur"],"answer":1},{"id":"STSI4407-39","question":"Organisasi mencari standar untuk menunjukkan pengelolaan proses layanan TI kepada pelanggan. Menurut materi Tuton, standar yang secara khusus dibahas untuk kebutuhan tersebut ialah …","explanation":"Materi menyebut ISO/IEC 20000 sebagai standar internasional untuk proses manajemen layanan TI.","topic":"ISO/IEC 20000 dan ITSM","level":"Penerapan","source":{"file":"Inisiasi7_ManajemenLayananSI.pdf","session":7,"page":3},"options":["ITIL service pipeline sebagai standar audit pihak ketiga","ISO/IEC 27001 sebagai nama proses penutupan insiden","FitSM-3 sebagai dokumen sertifikasi seluruh organisasi","ISO/IEC 20000 sebagai standar internasional manajemen layanan TI"],"answer":3},{"id":"STSI4407-40","question":"Tim membedakan dokumen persyaratan sistem manajemen layanan dari panduan cara menerapkannya. Menurut pembagian dalam materi Tuton, pasangan yang tepat adalah …","explanation":"Dalam pembagian materi Tuton, bagian 1 menjelaskan persyaratan atau apa yang harus dilakukan, sedangkan bagian 2 menjelaskan panduan penerapan.","topic":"Bagian ISO/IEC 20000","level":"Penerapan","source":{"file":"Inisiasi7_ManajemenLayananSI.pdf","session":7,"page":4},"options":["ISO 20000-1 memberi panduan penerapan dan ISO 20000-2 memuat persyaratan","ISO 20000-1 memberi model peran dan ISO 20000-2 memberi template","ISO 20000-1 memuat persyaratan dan ISO 20000-2 memberi panduan penerapan","ISO 20000-1 hanya memuat katalog dan ISO 20000-2 hanya memuat insiden"],"answer":2},{"id":"STSI4407-41","question":"Organisasi telah melakukan tinjauan internal dan ingin memperoleh sertifikasi. Menurut materi Tuton, demonstrasi kesesuaian untuk sertifikasi membutuhkan …","explanation":"Sertifikasi memerlukan adopsi persyaratan serta demonstrasi kesesuaian melalui audit oleh pihak ketiga.","topic":"Audit sertifikasi","level":"Penerapan","source":{"file":"Inisiasi7_ManajemenLayananSI.pdf","session":7,"page":5},"options":["penerbitan katalog layanan tanpa penilaian kesesuaian","persetujuan pengguna harian tanpa pemeriksaan persyaratan","audit pihak ketiga oleh badan atau lembaga sertifikasi","penggantian seluruh audit dengan laporan jumlah perangkat"],"answer":2},{"id":"STSI4407-42","question":"Tim memisahkan pengelolaan hubungan dengan pemasok dari hubungan penyedia layanan dengan bisnis. Menurut materi Tuton, pembagian proses yang benar ialah …","explanation":"Materi membedakan supplier management untuk interaksi pemasok dengan penyedia layanan dan BRM untuk interaksi penyedia layanan dengan bisnis.","topic":"Relationship processes ISO","level":"Penerapan","source":{"file":"Inisiasi7_ManajemenLayananSI.pdf","session":7,"page":9},"options":["kedua hubungan hanya dikelola melalui release and deployment management","supplier management untuk pemasok dan business relationship management untuk bisnis","business relationship management untuk aset dan supplier management untuk insiden","supplier management untuk pengguna saja dan business relationship management untuk perangkat"],"answer":1},{"id":"STSI4407-43","question":"Suatu kelompok TI meminta agar semua perubahan mengutamakan kebutuhannya meskipun merugikan tujuan organisasi. Menurut materi Tuton, change management seharusnya …","explanation":"Change management harus menghindari keberpihakan pada satu kelompok agar keputusan efektif mendukung tujuan organisasi secara keseluruhan.","topic":"Netralitas change management","level":"Analisis","source":{"file":"Inisiasi7_ManajemenLayananSI.pdf","session":7,"page":13},"options":["mengesahkan perubahan tanpa penilaian agar tidak menghambat","tidak berpihak pada satu kelompok dan mendukung tujuan organisasi keseluruhan","mengikuti kelompok yang mengajukan perubahan paling awal","menolak setiap perubahan supaya CMDB tidak perlu diperbarui"],"answer":1},{"id":"STSI4407-44","question":"Tim menganggap setiap tahap siklus ITIL berjalan sekali tanpa umpan balik. Menurut siklus yang dijelaskan dalam materi Tuton, anggapan ini perlu diperbaiki karena …","explanation":"Materi menekankan siklus ITIL tidak linear. Pemantauan, penilaian, serta umpan balik pada setiap tahapan membantu menentukan perbaikan.","topic":"Hubungan tahapan siklus ITIL","level":"Analisis","source":{"file":"Inisiasi7_ManajemenLayananSI.pdf","session":7,"page":17},"options":["umpan balik hanya diberikan setelah semua layanan dihentikan","setiap tahap saling memberi umpan balik dan siklusnya tidak bersifat linear","seluruh tahap dihapus ketika layanan mulai dioperasikan","strategi layanan sepenuhnya terpisah dari operasi dan perbaikan"],"answer":1},{"id":"STSI4407-45","question":"Organisasi menginginkan implementasi ITSM yang ringan dan dapat dicapai tetapi tetap kompatibel dengan ITIL serta ISO/IEC 20000. Menurut materi Tuton, pilihan yang sesuai ialah …","explanation":"FitSM dirancang sebagai standar ringan yang kompatibel dengan ITIL dan ISO/IEC 20000 serta menargetkan implementasi yang dapat dicapai.","topic":"Tujuan FitSM","level":"Penerapan","source":{"file":"Inisiasi8_ManajemenLayananSI.pdf","session":8,"page":2},"options":["menghapus persyaratan pengelolaan layanan karena ukuran organisasi kecil","menerapkan hanya proses pelaporan tanpa pengelolaan layanan lainnya","FitSM dengan pendekatan standar yang pragmatis dan ringan","memakai service pipeline sebagai pengganti semua proses ITSM"],"answer":2},{"id":"STSI4407-46","question":"Tim baru ingin memahami daftar lengkap dokumen FitSM dan memilih bacaan tentang istilah dasar. Menurut materi Tuton, pasangan yang tepat ialah …","explanation":"Materi mencantumkan tujuh dokumen bernomor 0 hingga 6. FitSM-0 menyediakan gambaran umum dan daftar kosakata.","topic":"Tujuh dokumen FitSM","level":"Penerapan","source":{"file":"Inisiasi8_ManajemenLayananSI.pdf","session":8,"page":3},"options":["tujuh dokumen FitSM-0 sampai FitSM-6, dengan kosakata dasar pada FitSM-0","tujuh dokumen FitSM-1 sampai FitSM-7, dengan kosakata dasar pada FitSM-4","delapan dokumen FitSM-0 sampai FitSM-7, dengan kosakata dasar pada FitSM-3","enam dokumen FitSM-1 sampai FitSM-6, dengan kosakata dasar pada FitSM-6"],"answer":0},{"id":"STSI4407-47","question":"Tim sudah membaca persyaratan implementasi ITSM dan kini membutuhkan panduan kegiatan untuk menjalankannya. Menurut materi Tuton, perpindahan dokumen yang tepat ialah …","explanation":"FitSM-1 mendefinisikan persyaratan implementasi, sedangkan FitSM-2 memberikan pedoman kegiatan pengaturan dan implementasi proses ITSM.","topic":"Persyaratan dan aktivitas FitSM","level":"Penerapan","source":{"file":"Inisiasi8_ManajemenLayananSI.pdf","session":8,"page":4},"options":["dari FitSM-4 untuk persyaratan ke FitSM-0 untuk penilaian maturitas","dari FitSM-1 untuk persyaratan ke FitSM-2 untuk kegiatan implementasi","dari FitSM-2 untuk persyaratan ke FitSM-5 untuk model peran","dari FitSM-6 untuk persyaratan ke FitSM-3 untuk template"],"answer":1},{"id":"STSI4407-48","question":"Tim membutuhkan model peran dan skema penilaian maturitas serta kapabilitas. Menurut materi Tuton, dua dokumen yang paling sesuai adalah …","explanation":"FitSM-3 memuat model peran. FitSM-6 memuat skema penilaian maturitas dan kapabilitas.","topic":"Dokumen pendukung FitSM","level":"Penerapan","source":{"file":"Inisiasi8_ManajemenLayananSI.pdf","session":8,"page":3},"options":["FitSM-2 untuk model peran dan FitSM-0 untuk penilaian maturitas","FitSM-3 untuk model peran dan FitSM-6 untuk penilaian maturitas serta kapabilitas","FitSM-4 untuk model peran dan FitSM-5 untuk penilaian kapabilitas","FitSM-0 untuk model peran dan FitSM-1 untuk penilaian maturitas"],"answer":1},{"id":"STSI4407-49","question":"Tim mengelompokkan manajemen portofolio, level layanan, dan hubungan pelanggan. Menurut model FitSM pada materi Tuton, ketiganya berada dalam kelompok …","explanation":"Materi mengelompokkan SPM, SLM, dan CRM dalam Offer and Agree.","topic":"Kelompok Offer and Agree","level":"Penerapan","source":{"file":"Inisiasi8_ManajemenLayananSI.pdf","session":8,"page":5},"options":["Resolve and Prevent atau Penyelesaian dan Pencegahan","Protect and Secure atau Perlindungan dan Pengamanan","Offer and Agree atau Penawaran dan Persetujuan","Control and Deploy atau Kontrol dan Penerapan"],"answer":2},{"id":"STSI4407-50","question":"Dalam pengelompokan model FitSM, tim menempatkan manajemen keamanan informasi pada bidang perlindungan. Menurut materi Tuton, kelompok yang benar ialah …","explanation":"Kelompok Protect and Secure pada materi terdiri atas satu proses, yaitu Information Security Management.","topic":"Kelompok Protect and Secure","level":"Penerapan","source":{"file":"Inisiasi8_ManajemenLayananSI.pdf","session":8,"page":6},"options":["Report and Improve yang hanya memuat pengelolaan pemasok","Control and Deploy yang hanya memuat hubungan pelanggan","Protect and Secure yang memuat Information Security Management","Offer and Agree yang memuat seluruh pengelolaan insiden"],"answer":2}]},{"code":"STSI4408","name":"E-Bisnis","reference":"Katalog UT mencantumkan kode bahan ajar STSI4408. Slide Tuton STSI4408 merujuk BMP E-Business MSIM4409.","coverage":"Materi Tuton STSI4408 sesi 1–8.","note":"","questions":[{"id":"STSI4408-01","question":"Perusahaan mendigitalkan koordinasi pemasok, proses internal, dan layanan pelanggan agar lebih efisien. Konsep yang paling tepat menggambarkan upaya menyeluruh ini adalah …","explanation":"E-business memanfaatkan TIK untuk mendukung dan mentransformasi proses bisnis organisasi secara lebih efektif dan efisien.","topic":"Konsep e-business","level":"Penerapan","source":{"file":"Materi Inisiasi E-Business MSIM4409 Sesi 1 KB 1.pdf","session":1,"page":4},"options":["E-commerce yang terbatas pada pembayaran","Pengarsipan dokumen sebagai aktivitas terpisah","Distribusi fisik tanpa dukungan informasi","E-business"],"answer":3},{"id":"STSI4408-02","question":"Aktivitas yang paling langsung mencerminkan fokus transaksi dalam e-commerce adalah …","explanation":"E-commerce menitikberatkan transaksi jual beli barang atau jasa melalui jaringan elektronik. Aktivitas digital internal memiliki cakupan e-business yang lebih luas.","topic":"Konsep e-commerce","level":"Penerapan","source":{"file":"Materi Inisiasi E-Business MSIM4409 Sesi 1 KB 1.pdf","session":1,"page":7},"options":["Pelanggan memesan dan membayar produk melalui jaringan elektronik","Staf mendokumentasikan rapat internal secara daring","Teknisi memperbarui inventaris komputer kantor","Manajer menyusun jadwal cuti secara digital"],"answer":0},{"id":"STSI4408-03","question":"Organisasi ingin mempercepat pertukaran dokumen dengan mitra. Perubahan yang sesuai karakter e-business dalam materi adalah …","explanation":"Materi menekankan pemanfaatan teknologi, dokumen softcopy, dan komunikasi yang lebih efektif serta efisien.","topic":"Bisnis digital","level":"Penerapan","source":{"file":"Materi Inisiasi E-Business MSIM4409 Sesi 1 KB 1.pdf","session":1,"page":14},"options":["Memusatkan pertukaran dokumen pada satu lokasi tatap muka","Membatasi pertukaran dokumen pada pertemuan fisik","Mewajibkan semua dokumen dikirim dalam hardcopy","Menggunakan dokumen softcopy untuk mendukung komunikasi yang efisien"],"answer":3},{"id":"STSI4408-04","question":"Manajer menggunakan laporan sistem informasi untuk menentukan produk yang harus diprioritaskan. Peran sistem informasi yang paling langsung terlihat adalah …","explanation":"Salah satu dari tiga peran sistem informasi dalam materi adalah mendukung pengambilan keputusan karyawan dan manajer.","topic":"Peran sistem informasi","level":"Penerapan","source":{"file":"Materi Inisiasi E-Business MSIM4409 Sesi 1 KB 1.pdf","session":1,"page":16},"options":["Menghapus kebutuhan proses operasional","Mendukung pengambilan keputusan oleh manajer","Membatasi penyusunan strategi kompetitif","Menggantikan seluruh tujuan bisnis perusahaan"],"answer":1},{"id":"STSI4408-05","question":"Menurut materi, kondisi yang merupakan ciri bisnis konvensional adalah …","explanation":"Materi menyebut komunikasi fisik, proses yang tidak real-time, dokumen hardcopy, serta keterbatasan jangkauan lokasi sebagai karakter bisnis konvensional.","topic":"Bisnis konvensional","level":"Pemahaman","source":{"file":"Materi Inisiasi E-Business MSIM4409 Sesi 1 KB 1.pdf","session":1,"page":13},"options":["Dokumen dibagikan dalam hardcopy dan jangkauan bisnis relatif terbatas","Transaksi dan koordinasi otomatis tidak bergantung lokasi","Seluruh komunikasi berlangsung melalui platform daring","Dokumen selalu terintegrasi secara real-time lintas negara"],"answer":0},{"id":"STSI4408-06","question":"Teknisi senior memiliki intuisi diagnosis dari pengalaman, sedangkan tim memiliki manual prosedur tertulis. Klasifikasi yang tepat adalah …","explanation":"Tacit knowledge bersumber dari pengalaman dan intuisi. Explicit knowledge terdokumentasi sehingga relatif mudah ditransfer.","topic":"Manajemen pengetahuan","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 2.pdf","session":2,"page":2},"options":["Intuisi merupakan tacit knowledge; manual merupakan explicit knowledge","Intuisi merupakan explicit knowledge; manual merupakan tacit knowledge","Keduanya explicit knowledge karena berguna untuk pekerjaan","Keduanya tacit knowledge karena digunakan oleh manusia"],"answer":0},{"id":"STSI4408-07","question":"Seorang pegawai belajar keterampilan dari rekan senior melalui pengalaman kerja bersama tanpa menuangkannya ke dokumen. Proses SECI tersebut adalah …","explanation":"Socialization adalah perpindahan tacit knowledge ke tacit knowledge melalui berbagi pengalaman.","topic":"Model SECI","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 2.pdf","session":2,"page":3},"options":["Internalization","Externalization","Socialization","Combination"],"answer":2},{"id":"STSI4408-08","question":"Perusahaan merekam keahlian praktis seorang ahli menjadi diagram dan panduan tertulis. Proses SECI yang paling sesuai adalah …","explanation":"Externalization mengubah pengetahuan tacit menjadi explicit, misalnya melalui diagram atau bentuk dokumentasi.","topic":"Model SECI","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 2.pdf","session":2,"page":3},"options":["Combination","Internalization","Socialization","Externalization"],"answer":3},{"id":"STSI4408-09","question":"Tim menyatukan beberapa laporan tertulis menjadi satu basis pengetahuan perusahaan. Proses SECI ini disebut …","explanation":"Combination menggabungkan informasi explicit menjadi pengetahuan explicit yang baru.","topic":"Model SECI","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 2.pdf","session":2,"page":3},"options":["Externalization","Combination","Internalization","Socialization"],"answer":1},{"id":"STSI4408-10","question":"Pegawai mempelajari manual lalu mempraktikkannya sampai menjadi keterampilan pribadi. Tahap SECI yang terjadi adalah …","explanation":"Internalization mengubah pengetahuan explicit menjadi tacit melalui pelatihan dan praktik.","topic":"Model SECI","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 2.pdf","session":2,"page":3},"options":["Socialization","Internalization","Externalization","Combination"],"answer":1},{"id":"STSI4408-11","question":"Perusahaan sudah membeli aplikasi wiki, tetapi pembagian peran dan proses berbagi pengetahuan belum diatur. Evaluasi yang tepat berdasarkan komponen KMS adalah …","explanation":"KMS memiliki komponen people, process, dan technology. Pengadaan aplikasi saja belum mencakup seluruh komponen tersebut.","topic":"Knowledge Management System","level":"Analisis","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 2.pdf","session":2,"page":5},"options":["Technology dapat menggantikan kebutuhan people dan process","KMS hanya mencakup penyimpanan perangkat keras","People dan process perlu dikelola bersama technology","People dan process tidak termasuk komponen KMS"],"answer":2},{"id":"STSI4408-12","question":"Perusahaan menjadikan data pelanggan dan insight pasar sebagai aset utama untuk menentukan arah bisnis. Konsep yang paling tepat adalah …","explanation":"Ekonomi informasi memandang informasi sebagai aset strategis, dengan contoh data pelanggan, insight pasar, dan paten.","topic":"Ekonomi informasi","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 2.pdf","session":2,"page":11},"options":["Produksi manual yang terpisah dari data pelanggan","Distribusi tradisional tanpa pengelolaan informasi","Ekonomi yang hanya bertumpu pada barang fisik","Ekonomi informasi"],"answer":3},{"id":"STSI4408-13","question":"Dalam SWOT toko daring, kurangnya keterampilan digital karyawan seharusnya ditempatkan sebagai …","explanation":"Strength dan weakness termasuk faktor internal; opportunity dan threat termasuk faktor eksternal. Kekurangan keterampilan karyawan merupakan kelemahan internal.","topic":"Analisis SWOT","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 3.pdf","session":3,"page":5},"options":["Weakness yang berasal dari lingkungan internal","Threat yang sepenuhnya berasal dari lingkungan eksternal","Strength yang berasal dari kemampuan pesaing","Opportunity yang berasal dari lingkungan eksternal"],"answer":0},{"id":"STSI4408-14","question":"Manajer ingin menelaah aktivitas internal yang memberi nilai tambah bagi pelanggan. Alat analisis yang paling langsung sesuai adalah …","explanation":"Model rantai nilai digunakan untuk menganalisis aktivitas internal perusahaan dan nilai tambah yang dihasilkannya.","topic":"Rantai nilai","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 3.pdf","session":3,"page":6},"options":["Analisis lima kekuatan untuk menilai struktur industri","Kontrol feedback untuk mengevaluasi hasil aktivitas","Pemetaan risiko untuk menaksir probabilitas kerugian","Value Chain Analysis"],"answer":3},{"id":"STSI4408-15","question":"Aplikasi transportasi daring menghadapi layanan lain yang memenuhi kebutuhan perjalanan dengan cara berbeda. Dalam Five Forces, tekanan ini paling sesuai dengan …","explanation":"Produk atau layanan substitusi memenuhi kebutuhan sejenis dengan alternatif berbeda, sehingga termasuk salah satu tekanan dalam Five Forces.","topic":"Five Forces","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 3.pdf","session":3,"page":7},"options":["Ancaman pendatang baru yang belum menawarkan layanan","Kekuatan tawar pembeli","Ancaman produk substitusi","Kekuatan tawar pemasok"],"answer":2},{"id":"STSI4408-16","question":"Platform memilih melayani khusus segmen UMKM kuliner daerah daripada seluruh jenis usaha. Strategi generik yang paling sesuai adalah …","explanation":"Strategi focus menargetkan segmen pasar tertentu. Pembatasan sasaran pada UMKM kuliner daerah menunjukkan fokus segmen.","topic":"Strategi generik Porter","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 3.pdf","session":3,"page":8},"options":["Differentiation yang tidak membatasi segmen","Cost leadership pada seluruh pasar","Focus","Diversifikasi ke seluruh lini usaha"],"answer":2},{"id":"STSI4408-17","question":"Setelah strategi e-bisnis dijalankan, manajer ingin memastikan implementasinya tetap sesuai rencana. Langkah yang paling sesuai adalah …","explanation":"Kontrol strategis dalam materi mencakup pengukuran kinerja, audit sistem TI, dan feedback pengguna atau pelanggan.","topic":"Kontrol strategis","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 3.pdf","session":3,"page":10},"options":["Menghentikan evaluasi setelah aplikasi mulai digunakan","Menyerahkan seluruh penilaian kepada pemasok tanpa data kinerja","Mengukur kinerja, mengaudit sistem TI, dan menelaah feedback pengguna","Menilai keberhasilan hanya dari jumlah komputer yang dibeli"],"answer":2},{"id":"STSI4408-18","question":"Sistem sudah tersedia, tetapi pengguna belum dilibatkan dan belum mendapat pelatihan. Faktor keberhasilan yang perlu diperkuat adalah …","explanation":"Keterlibatan pengguna, pelatihan SDM, dukungan manajemen, infrastruktur, dan manajemen perubahan merupakan faktor keberhasilan implementasi.","topic":"Implementasi strategi","level":"Analisis","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 3.pdf","session":3,"page":13},"options":["Penambahan fitur tanpa membahas cara penggunaannya","Pemisahan pengguna dari seluruh proses pengembangan","Keterlibatan pengguna serta pelatihan dan pengembangan SDM","Pengurangan dukungan manajemen terhadap implementasi"],"answer":2},{"id":"STSI4408-19","question":"Perusahaan memeriksa kesiapan keterampilan staf sebelum sistem baru mulai digunakan untuk mengantisipasi hambatan. Kontrol ini termasuk …","explanation":"Feedforward dilaksanakan sebelum aktivitas berlangsung untuk mengantisipasi masalah.","topic":"Kontrol organisasi","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 4.pdf","session":4,"page":2},"options":["Feedforward","Concurrent","Evaluasi setelah seluruh hasil akhir tersedia","Feedback"],"answer":0},{"id":"STSI4408-20","question":"Supervisor memantau kepatuhan standar kerja ketika pemrosesan pesanan sedang berjalan. Jenis kontrol tersebut adalah …","explanation":"Concurrent control berlangsung pada saat proses berjalan.","topic":"Kontrol organisasi","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 4.pdf","session":4,"page":2},"options":["Concurrent","Feedforward","Evaluasi output setelah kegiatan berakhir","Feedback"],"answer":0},{"id":"STSI4408-21","question":"Tim menilai kualitas dan jumlah pesanan yang selesai bulan lalu untuk memperbaiki proses bulan berikutnya. Kontrol ini adalah …","explanation":"Feedback control dilakukan setelah aktivitas, menggunakan output sebagai dasar perbaikan.","topic":"Kontrol organisasi","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 4.pdf","session":4,"page":2},"options":["Feedforward","Concurrent","Pengendalian sebelum pekerjaan dimulai","Feedback"],"answer":3},{"id":"STSI4408-22","question":"Tim memetakan dukungan pimpinan sebagai pendorong serta resistensi staf sebagai penghambat perubahan. Metode yang sesuai adalah …","explanation":"Force Field Analysis memetakan driving forces dan restraining forces yang memengaruhi perubahan organisasi.","topic":"Force Field Analysis","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 4.pdf","session":4,"page":6},"options":["Force Field Analysis","Model lima kekuatan Porter","Evaluasi aliran material SCM","Value Chain Analysis"],"answer":0},{"id":"STSI4408-23","question":"Perusahaan merancang ulang proses pesanan secara radikal untuk mencapai lompatan besar pada biaya, kualitas, layanan, dan kecepatan. Pendekatan ini adalah …","explanation":"BPR merupakan rekayasa ulang proses bisnis secara radikal untuk memperoleh peningkatan besar pada ukuran kinerja tersebut.","topic":"Business Process Reengineering","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 4.pdf","session":4,"page":9},"options":["Business Process Improvement (BPI) secara bertahap","Business Process Reengineering (BPR)","Pengarsipan ulang dokumen tanpa mengubah proses","Otomatisasi satu tugas tanpa meninjau rancangan proses"],"answer":1},{"id":"STSI4408-24","question":"Perusahaan tetap memakai proses distribusi yang ada, lalu meninjau dan memperbaikinya secara bertahap dengan aplikasi pada area tertentu. Pendekatan ini adalah …","explanation":"BPI menganalisis, meninjau, dan memperbaiki proses yang sedang berjalan melalui perubahan bertahap pada area tertentu.","topic":"Business Process Improvement","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 4.pdf","session":4,"page":10},"options":["Penghapusan seluruh aktivitas distribusi","Business Process Improvement (BPI)","Penggantian seluruh tujuan organisasi tanpa evaluasi","Business Process Reengineering yang merombak total proses"],"answer":1},{"id":"STSI4408-25","question":"Kegiatan memilih pemasok bahan baku dan mengelola hubungan pengadaan berada pada bagian rantai pasok …","explanation":"Upstream berfokus pada hubungan dengan pemasok dan pengadaan.","topic":"Bagian rantai pasok","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 5.pdf","session":5,"page":4},"options":["Layanan purnajual pelanggan akhir","Midstream","Downstream","Upstream"],"answer":3},{"id":"STSI4408-26","question":"Kegiatan produksi, manufaktur, dan pengendalian persediaan internal termasuk …","explanation":"Midstream merupakan bagian internal yang meliputi produksi, manufaktur, dan pengendalian persediaan.","topic":"Bagian rantai pasok","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 5.pdf","session":5,"page":4},"options":["Midstream","Upstream","Hubungan pemasok eksternal","Downstream"],"answer":0},{"id":"STSI4408-27","question":"Perusahaan menata distribusi produk jadi dan layanan kepada pelanggan. Bagian rantai pasok yang terutama ditangani adalah …","explanation":"Downstream meliputi distribusi, transportasi, pergudangan, dan layanan pelanggan.","topic":"Bagian rantai pasok","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 5.pdf","session":5,"page":4},"options":["Upstream","Downstream","Pengadaan bahan baku dari pemasok","Midstream produksi"],"answer":1},{"id":"STSI4408-28","question":"Pabrik memproduksi berdasarkan prediksi permintaan dan menyiapkan persediaan besar sebelum pesanan pelanggan diterima. Model ini adalah …","explanation":"Model push menggunakan prediksi dan cenderung menyimpan stok lebih besar untuk efisiensi biaya produksi.","topic":"Model push dan pull","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 5.pdf","session":5,"page":6},"options":["Push","Produksi yang sepenuhnya dipicu pesanan aktual","Pemenuhan responsif dengan stok minimum","Pull"],"answer":0},{"id":"STSI4408-29","question":"Produk baru dibuat setelah pesanan pelanggan masuk dengan tujuan menjaga stok tetap minimum. Model yang sesuai adalah …","explanation":"Model pull merespons pesanan pelanggan dan berorientasi pada stok minim serta efisiensi biaya inventori.","topic":"Model push dan pull","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 5.pdf","session":5,"page":6},"options":["Penumpukan stok besar sebelum ada pesanan","Pull","Push","Produksi spekulatif berdasarkan prediksi"],"answer":1},{"id":"STSI4408-30","question":"Informasi status persediaan dan permintaan pelanggan yang dipertukarkan antara produsen dan pemasok tergolong …","explanation":"Aliran informasi mencakup data permintaan, pesanan, keluhan, serta status inventori. Pergerakan barang merupakan aliran material, sedangkan pembayaran merupakan aliran dana.","topic":"Aliran SCM","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 5.pdf","session":5,"page":10},"options":["Aliran dana pembayaran","Perpindahan kepemilikan gudang","Aliran informasi","Aliran material fisik"],"answer":2},{"id":"STSI4408-31","question":"Aktivitas yang paling tepat digolongkan sebagai procurement yang bersifat strategis adalah …","explanation":"Procurement mencakup penetapan kebutuhan, evaluasi pemasok, negosiasi kontrak, dan relasi. Purchasing lebih berfokus pada transaksi pembelian.","topic":"Procurement dan purchasing","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 6.pdf","session":6,"page":2},"options":["Mencatat penerimaan barang sesuai pesanan pembelian","Mengevaluasi pemasok dan menegosiasikan kontrak jangka panjang","Mengatur pembayaran atas barang yang sudah diterima","Menerbitkan purchase order untuk kebutuhan yang sudah disetujui"],"answer":1},{"id":"STSI4408-32","question":"Organisasi menggunakan internet untuk membuat proses pengadaan lebih efisien, transparan, dan akuntabel. Konsep yang paling sesuai adalah …","explanation":"E-procurement adalah pengadaan berbasis teknologi informasi atau internet dengan prinsip efisiensi, efektivitas, transparansi, kompetitif, dan akuntabilitas.","topic":"E-procurement","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 6.pdf","session":6,"page":5},"options":["Business intelligence untuk laporan penjualan","E-procurement","E-marketing","Manajemen hubungan pelanggan"],"answer":1},{"id":"STSI4408-33","question":"Barang sudah berkualitas sesuai kebutuhan dan datang tepat waktu, tetapi jumlahnya jauh melebihi kebutuhan optimal. Prinsip 6 Rights yang belum terpenuhi adalah …","explanation":"Right Quantity menekankan jumlah sesuai kebutuhan optimal, terpisah dari aspek kualitas, waktu, harga, sumber, dan tempat.","topic":"Prinsip pembelian","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 6.pdf","session":6,"page":3},"options":["Right Quality","Right Time","Right Quantity","Right Source"],"answer":2},{"id":"STSI4408-34","question":"Setelah menemukan pemasok yang relevan, tim mengirim RFQ. Apa tujuan langsung dokumen tersebut?","explanation":"RFQ merupakan permintaan penawaran dalam tahap pemilihan pemasok. Evaluasi penawaran dilakukan pada tahap berikutnya.","topic":"Tahapan pengadaan","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 6.pdf","session":6,"page":6},"options":["Mengesahkan hasil produksi yang telah selesai","Meminta penawaran dari calon pemasok","Mengganti seluruh kegiatan pemeriksaan barang","Menutup kontrak tanpa evaluasi harga dan kualitas"],"answer":1},{"id":"STSI4408-35","question":"Tim mengoptimalkan moda pengiriman, rencana rute, dan jadwal perjalanan barang. Komponen logistik yang dikelola adalah …","explanation":"Materi menempatkan moda, operasi pengiriman, rencana, dan jadwal rute dalam komponen transportasi.","topic":"Komponen logistik","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 6.pdf","session":6,"page":9},"options":["Inventori berdasarkan jumlah persediaan","Pengemasan dan utilitas","Transportasi","Pergudangan dan penanganan material"],"answer":2},{"id":"STSI4408-36","question":"Perusahaan menata pengembalian barang pelanggan untuk diperbaiki atau didaur ulang. Aktivitas ini termasuk …","explanation":"Reverse logistics berkaitan dengan pengembalian barang, daur ulang, dan perbaikan produk.","topic":"Reverse logistics","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 6.pdf","session":6,"page":10},"options":["Distribusi awal produk jadi ke pelanggan","Reverse logistics","Pemilihan rute untuk pengiriman perdana","Pengadaan bahan baku baru dari pemasok"],"answer":1},{"id":"STSI4408-37","question":"Dalam SOSTAC, analisis permintaan, kompetitor, dan sumber daya terutama dilakukan pada bagian …","explanation":"Analisis situasi mencakup permintaan, kompetitor, perantara, SWOT, SLEPT, dan sumber daya sebagai dasar perencanaan.","topic":"Perencanaan e-marketing","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 7.pdf","session":7,"page":3},"options":["Objectives","Control","Situation","Action"],"answer":2},{"id":"STSI4408-38","question":"Toko daring memberi penawaran relevan kepada pelanggan lama agar mereka tetap membeli. Aktivitas CRM yang paling sesuai adalah …","explanation":"Customer Retention bertujuan mempertahankan pelanggan, antara lain melalui penawaran relevan, komunitas, dan email marketing.","topic":"Aktivitas CRM","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 7.pdf","session":7,"page":5},"options":["Customer Retention","Customer Acquisition","Customer Extension melalui perluasan jenis pembelian","Customer Selection"],"answer":0},{"id":"STSI4408-39","question":"Setelah pelanggan membeli kamera, toko menawarkan lensa tambahan yang sesuai. Aktivitas cross-sell tersebut termasuk …","explanation":"Customer Extension memperluas interaksi dan nilai pelanggan melalui re-sell, cross-sell, up-sell, reaktivasi, serta referensi.","topic":"Aktivitas CRM","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 7.pdf","session":7,"page":5},"options":["Customer Selection","Analisis situasi pemasaran","Customer Acquisition","Customer Extension"],"answer":3},{"id":"STSI4408-40","question":"Perusahaan menganalisis pola pembelian dan preferensi pelanggan untuk menemukan tren. Jenis e-CRM yang paling sesuai adalah …","explanation":"E-CRM analitik mengolah data pelanggan, termasuk tren, preferensi, dan perilaku.","topic":"Jenis e-CRM","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 7.pdf","session":7,"page":7},"options":["Analitik","Operasional yang berfokus pada otomatisasi layanan","Manajemen inventori untuk pencatatan barang gudang","Kolaboratif yang berfokus pada berbagi informasi antarunit"],"answer":0},{"id":"STSI4408-41","question":"Bagian logistik, akuntansi, dan SDM memakai data terpisah sehingga pencatatan ganda sering terjadi. Solusi yang sesuai konsep ERP adalah …","explanation":"ERP mengintegrasikan dan mengotomatisasi proses lintas fungsi. Sumber data terpusat membantu menghindari duplikasi serta menjaga integritas data.","topic":"ERP","level":"Analisis","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 7.pdf","session":7,"page":8},"options":["Menambah database terpisah tanpa mekanisme integrasi","Mengintegrasikan proses lintas fungsi dengan sumber data terpusat","Mempertahankan salinan data yang berbeda di setiap fungsi","Membatasi sistem hanya pada promosi dan penjualan daring"],"answer":1},{"id":"STSI4408-42","question":"Direksi ingin mengolah data historis dan operasional menjadi insight untuk mengambil keputusan. Sistem yang paling sesuai adalah …","explanation":"BI mengubah data menjadi informasi dan insight untuk mendukung keputusan, termasuk pelaporan, OLAP, analitik, dan data mining.","topic":"Business Intelligence","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 7.pdf","session":7,"page":11},"options":["Sistem transportasi untuk menyusun rute fisik","Pengadaan elektronik untuk meminta penawaran","Alat komunikasi untuk menyelenggarakan pertemuan","Business Intelligence"],"answer":3},{"id":"STSI4408-43","question":"Dalam arsitektur BI, aktivitas mengambil data, mengubahnya, dan memuatnya ke penyimpanan disebut …","explanation":"ETL merupakan tahap Extract, Transform, Load. Dashboard dan OLAP memiliki peran berbeda dari pemindahan serta transformasi data tersebut.","topic":"Arsitektur BI","level":"Pemahaman","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 7.pdf","session":7,"page":12},"options":["Data source sebagai asal data mentah","OLAP: analisis multidimensi untuk pengguna","Front-end dashboard untuk menyajikan hasil","ETL: Extract, Transform, Load"],"answer":3},{"id":"STSI4408-44","question":"Organisasi menyempurnakan proses yang ada secara bertahap tanpa mengubah pola pikir dan budaya secara mendasar. Jenis perubahan ini adalah …","explanation":"Developmental merupakan perbaikan bertahap. Transitional mengganti cara lama dengan cara baru, sedangkan transformational menyentuh pola pikir dan kultur secara radikal.","topic":"Jenis perubahan","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 8.pdf","session":8,"page":3},"options":["Transitional","Developmental","Transformational","Penggantian menyeluruh terhadap identitas organisasi"],"answer":1},{"id":"STSI4408-45","question":"Transformasi e-bisnis merombak cara kerja sekaligus pola pikir dan kultur organisasi secara radikal. Jenis perubahan yang sesuai adalah …","explanation":"Transformational adalah perubahan radikal yang menyentuh mindset dan kultur organisasi.","topic":"Jenis perubahan","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 8.pdf","session":8,"page":3},"options":["Transformational","Developmental","Transitional yang terbatas pada penggantian cara kerja","Pemeliharaan rutin sistem tanpa perubahan budaya"],"answer":0},{"id":"STSI4408-46","question":"Program perubahan sudah menunjukkan keberhasilan awal. Agar bertahan, langkah akhir model Kotter dalam materi adalah …","explanation":"Tahap terakhir model Kotter adalah melembagakan perubahan ke dalam budaya organisasi agar praktik baru dapat bertahan.","topic":"Model Kotter","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 8.pdf","session":8,"page":5},"options":["Menghentikan koalisi pimpinan sebelum perubahan berjalan","Meniadakan evaluasi setelah keberhasilan jangka pendek","Mengulang penetapan visi tanpa menindaklanjuti hasil","Melembagakan perubahan dalam budaya organisasi"],"answer":3},{"id":"STSI4408-47","question":"Tim mencatat potensi gangguan, penyebab, serta dampaknya sebelum melakukan penilaian. Tahap manajemen risiko ini adalah …","explanation":"Identifikasi risiko mencatat potensi risiko beserta penyebab dan dampaknya. Analisis, evaluasi, dan penanganan dilakukan untuk tujuan yang berbeda.","topic":"Identifikasi risiko","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 8.pdf","session":8,"page":9},"options":["Pemantauan efektivitas tindakan yang sudah berjalan","Evaluasi risiko untuk menentukan prioritas","Identifikasi risiko","Penanganan risiko setelah strategi dipilih"],"answer":2},{"id":"STSI4408-48","question":"Menggunakan model sederhana pada materi Tuton, skor kemungkinan suatu risiko adalah 3 dan skor dampaknya 5. Berapa level risiko berdasarkan perkalian kedua skor tersebut?","explanation":"Materi menghitung level risiko sebagai probabilitas × dampak. Dengan skor yang diberikan, 3 × 5 = 15.","topic":"Evaluasi risiko","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 8.pdf","session":8,"page":9},"options":["8","0,6","15","2"],"answer":2},{"id":"STSI4408-49","question":"Perusahaan menghentikan aktivitas bisnis tertentu agar tidak lagi terpapar risiko dari aktivitas tersebut. Strategi penanganan yang paling sesuai adalah …","explanation":"Menghindari risiko berarti tidak melanjutkan aktivitas yang menjadi sumber paparannya. Ini berbeda dari menerima, mengurangi, atau mengalihkan risiko.","topic":"Penanganan risiko","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 8.pdf","session":8,"page":9},"options":["Menerima risiko","Mengalihkan risiko","Melakukan pemantauan tanpa mengubah aktivitas","Menghindari risiko"],"answer":3},{"id":"STSI4408-50","question":"Menurut kerangka ISO 31000:2018 yang dibahas dalam Tuton, risiko dikelola pada semua proses dan fungsi organisasi melalui unsur …","explanation":"Integration menempatkan pengelolaan risiko dalam semua proses dan fungsi organisasi. Unsur lain memiliki fokus pelaksanaan, evaluasi, atau perbaikan.","topic":"Kerangka manajemen risiko","level":"Penerapan","source":{"file":"Materi Inisiasi E-Bisnis STSI4408 Sesi 8.pdf","session":8,"page":11},"options":["Integration","Evaluation yang berfokus pada penilaian efektivitas","Implementation yang berfokus pada menjalankan rencana","Improvement yang berfokus pada perbaikan berkelanjutan"],"answer":0}]}]}</script>
  <script>(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('question-data').textContent);
  const COURSES = new Map(DATA.courses.map(c => [c.code, c]));
  const STORE = 'ruang-latihan-ut-v1';
  const LETTERS = 'ABCD';
  const main = document.getElementById('main');
  const dialog = document.getElementById('dialog');
  const dialogContent = document.getElementById('dialog-content');
  const footer = document.getElementById('site-footer');
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let storageOK = true;
  let sessions = {};
  let current = null;
  let reviewFilter = 'wrong';
  function shuffled(items) {
    const a = [...items];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function validSession(s, c) {
    if (!s || s.version !== DATA.version || !['practice','exam'].includes(s.mode)) return false;
    const ids = new Set(c.questions.map(q => q.id));
    if (!Array.isArray(s.order) || s.order.length !== ids.size || new Set(s.order).size !== ids.size || s.order.some(id => !ids.has(id))) return false;
    if (!Number.isInteger(s.position) || s.position < 0 || s.position >= ids.size) return false;
    if (!s.choices || !s.responses || !s.checked || !s.flags) return false;
    for (const id of s.order) {
      const options = s.choices[id];
      if (!Array.isArray(options) || options.length !== 4 || [...options].sort().join() !== '0,1,2,3') return false;
      const answer = s.responses[id];
      if (answer !== undefined && (!Number.isInteger(answer) || answer < 0 || answer > 3)) return false;
    }
    return Object.keys(s.responses).every(id => ids.has(id));
  }
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || '{}');
    if (saved && typeof saved === 'object') for (const c of DATA.courses) {
      if (validSession(saved[c.code], c)) sessions[c.code] = saved[c.code];
    }
  } catch (_) { storageOK = false; }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(sessions)); }
    catch (_) { storageOK = false; }
  }
  function announce(text) { document.getElementById('announcement').textContent = text; }
  function navigate(path) {
    if (location.hash === '#' + path) route();
    else location.hash = path;
  }
  function focusMain() { main.focus({preventScroll:true}); window.scrollTo({top:0,behavior:'auto'}); }
  function question(c, id) { return c.questions.find(q => q.id === id); }
  function answered(s) { return Object.keys(s.responses).length; }
  function score(c, s) { return c.questions.reduce((n, q) => n + (s.responses[q.id] === q.answer ? 1 : 0), 0); }
  function letter(s, q, originalIndex) { return LETTERS[s.choices[q.id].indexOf(originalIndex)]; }
  function note() { return storageOK ? '' : '<p class="storage-notice" role="status">Browser ini tidak mengizinkan penyimpanan progres. Tetap bisa latihan, tetapi jangan tutup halaman sebelum selesai.</p>'; }
  function showDialog(html) {
    if (dialog.open) dialog.close();
    dialogContent.innerHTML = html;
    dialog.showModal();
  }
  function dialogHead(title) { return `<div class="dialog-top"><h2 id="dialog-title">${esc(title)}</h2><button type="button" class="close-dialog" data-action="close" aria-label="Tutup dialog">×</button></div>`; }
  function renderHome() {
    current = null;
    footer.className = 'site-footer';
    main.innerHTML = `${note()}<section class="hero"><div><p class="eyebrow">LATIHAN UAS · SEMESTER 7</p><h1>Satu soal lagi.<br><span>Satu konsep lebih paham.</span></h1><p>Pilih mata kuliah, jawab soalnya, lalu pelajari pembahasannya. Mulai dari materi yang ingin kamu kuasai hari ini.</p></div><div class="hero-summary" aria-label="Cakupan latihan"><div><strong>5</strong><span>mata kuliah</span></div><div><strong>250</strong><span>soal + pembahasan</span></div></div></section><section aria-labelledby="courses-title"><div class="section-heading"><h2 id="courses-title">Pilih mata kuliah</h2><span class="subtle">50 soal per mata kuliah</span></div><div class="course-grid">${DATA.courses.map(c => {
      const s = sessions[c.code];
      const status = s ? s.finished ? `Skor terakhir <strong>${score(c,s)*2}/100</strong> · ${s.mode==='exam'?'Ujian':'Latihan'}` : `${answered(s)}/50 terjawab · ${s.mode==='exam'?'Mode ujian':'Mode latihan'}` : 'Siap untuk mulai';
      return `<article class="course-card"><div class="course-code">${c.code}</div><h3>${esc(c.name)}</h3><p class="course-meta">50 pilihan ganda · 4 opsi per soal</p><p class="course-status">${status}</p><div class="course-actions">${s ? `<button type="button" class="primary" data-action="resume" data-course="${c.code}">${s.finished?'Lihat hasil':'Lanjutkan'}</button><button type="button" class="secondary" data-action="setup" data-course="${c.code}">Latihan baru</button>` : `<button type="button" class="primary" data-action="setup" data-course="${c.code}">Mulai latihan</button>`}</div></article>`;
    }).join('')}</div></section><aside class="info-strip"><strong>Belajar sesuai caramu.</strong> Mode latihan membuka kunci setelah kamu mengecek jawaban. Mode ujian menyimpan pembahasan sampai seluruh latihan kamu selesaikan.</aside><p class="tiny-note">Materi mengikuti kode mata kuliah UT dan sesi Tuton yang tersedia. Capstone Project dan Manajemen Proyek tidak termasuk.</p>`;
    focusMain();
  }
  function setup(code) {
    const c = COURSES.get(code);
    if (!c) return;
    showDialog(`${dialogHead(c.name)}<p class="dialog-text">${c.code} · 50 soal pilihan ganda. Jawaban dan pembahasan merujuk materi Tuton mata kuliah ini.</p><form id="setup-form" data-course="${code}"><fieldset class="mode-options"><legend>Pilih cara mengerjakan</legend><label class="mode-option"><input type="radio" name="mode" value="practice" checked><span><strong>Latihan</strong><small>Cek jawaban dan baca pembahasan setelah menjawab tiap soal.</small></span></label><label class="mode-option"><input type="radio" name="mode" value="exam"><span><strong>Ujian</strong><small>Kunci dan pembahasan baru ditampilkan setelah selesai.</small></span></label></fieldset><label class="checkbox-line"><input type="checkbox" name="shuffle" checked>Acak urutan soal dan pilihan jawaban</label>${c.note?`<p class="notice">${esc(c.note)}</p>`:''}${sessions[code]?'<p class="notice">Memulai latihan baru akan mengganti progres dan hasil terakhir mata kuliah ini pada browser ini.</p>':''}<div class="dialog-actions"><button type="button" class="secondary" data-action="close">Batal</button><button type="submit" class="primary">Mulai 50 soal</button></div></form>`);
  }
  function start(code, mode, randomize) {
    const c = COURSES.get(code);
    const order = c.questions.map(q => q.id);
    sessions[code] = {version:DATA.version,mode,order:randomize?shuffled(order):order,choices:Object.fromEntries(order.map(id=>[id,randomize?shuffled([0,1,2,3]):[0,1,2,3]])),responses:{},checked:{},flags:{},position:0,started:Date.now(),finished:null};
    save(); dialog.close(); navigate(code);
  }
  function sourceReference(q) {
    return `<details class="source-reference"><summary>Rujukan materi · Sesi ${q.source.session}, hlm. ${q.source.page}</summary><p>${esc(q.source.file)}</p><p>Topik: ${esc(q.topic)}. Nomor halaman mengikuti urutan halaman berkas Tuton.</p></details>`;
  }
  function mapClass(s, c, id, index) {
    let status = index===s.position?' current':'';
    if (s.responses[id] !== undefined) status += s.mode==='practice'&&s.checked[id] ? s.responses[id]===question(c,id).answer?' right':' wrong' : ' answered';
    if (s.flags[id]) status+=' flagged';
    return status;
  }
  function renderQuiz(code, focus = true) {
    const c = COURSES.get(code), s = sessions[code];
    if (!s) { renderHome(); setup(code); return; }
    if (s.finished) { renderResults(code); return; }
    current = code;
    footer.className='site-footer';
    const q = question(c,s.order[s.position]);
    const selected=s.responses[q.id];
    const checked=s.mode==='practice'&&s.checked[q.id];
    const mapOpen=!!document.getElementById('question-map')?.open;
    main.innerHTML=`${note()}<div class="quiz-wrap"><div class="back-row"><button type="button" class="text-button" data-action="home">Simpan & kembali</button><button type="button" class="text-button" data-action="finish">Selesaikan</button></div><div class="quiz-heading"><div><div class="course-code">${c.code}</div><h1>${esc(c.name)}</h1></div><span class="pill">${s.mode==='practice'?'Mode latihan':'Mode ujian'}</span></div><div class="quiz-progress"><span>Soal <strong>${s.position+1}</strong> dari 50</span><span id="answered-count">${answered(s)}/50 terjawab</span></div><div class="progress" role="progressbar" aria-label="Soal terjawab" aria-valuenow="${answered(s)}" aria-valuemin="0" aria-valuemax="50"><span style="width:${answered(s)*2}%"></span></div><section class="question-card" aria-labelledby="question-title"><div class="question-meta"><span class="question-label">Sesi ${q.source.session} · ${esc(q.level)}</span><button type="button" class="flag" data-action="flag" aria-pressed="${!!s.flags[q.id]}">${s.flags[q.id]?'Ditandai':'Tandai ragu'}</button></div><h2 id="question-title" class="question-title" tabindex="-1">${esc(q.question)}</h2><fieldset class="choices"><legend class="sr-only">Pilih satu jawaban</legend>${s.choices[q.id].map((oi,i)=>{
      const correct=checked&&oi===q.answer;
      const wrong=checked&&selected===oi&&oi!==q.answer;
      return `<label class="choice${selected===oi?' selected':''}${correct?' correct':''}${wrong?' incorrect':''}${checked?' locked':''}"><input type="radio" name="answer" value="${oi}" ${selected===oi?'checked':''} ${checked?'disabled':''}><span class="choice-letter" aria-hidden="true">${LETTERS[i]}</span><span class="option-text">${esc(q.options[oi])}</span>${correct?'<span class="choice-status">Kunci</span>':wrong?'<span class="choice-status">Pilihanmu</span>':''}</label>`;
    }).join('')}</fieldset>${s.mode==='practice'&&!checked?`<div class="check-row"><button type="button" class="primary" id="check-answer" data-action="check" ${selected===undefined?'disabled':''}>Cek jawaban</button><span class="subtle">Pilih jawaban dulu, lalu cek.</span></div>`:''}${checked?`<div class="feedback"><p id="feedback-title" tabindex="-1" class="feedback-title${selected===q.answer?'':' wrong'}">${selected===q.answer?'Jawaban benar.':'Belum tepat.'} Kunci: ${letter(s,q,q.answer)}</p><p>${esc(q.explanation)}</p>${sourceReference(q)}</div>`:''}<p class="mode-hint">${s.mode==='exam'?'Kamu bisa mengubah jawaban sampai latihan diselesaikan. Kunci dibuka setelah selesai.':'Jawaban yang sudah dicek dikunci. Kamu bisa melewati soal dan kembali lewat daftar soal.'}</p></section><details id="question-map" class="question-map" ${mapOpen?'open':''}><summary>Daftar 50 soal</summary><p class="map-legend">Biru: terjawab · Garis kuning: ragu${s.mode==='practice'?' · Hijau/merah: hasil jawaban yang sudah dicek':''}</p><div class="map-grid">${s.order.map((id,i)=>`<button type="button" class="map-btn${mapClass(s,c,id,i)}" data-action="jump" data-index="${i}" aria-label="Soal ${i+1}${s.responses[id]!==undefined?', terjawab':', belum dijawab'}${s.flags[id]?', ditandai':''}" ${i===s.position?'aria-current="step"':''}>${i+1}</button>`).join('')}</div></details><nav class="sticky-nav" aria-label="Navigasi soal"><button type="button" class="secondary" data-action="previous" ${s.position===0?'disabled':''}>Sebelumnya</button><button type="button" class="secondary nav-map" data-action="map" aria-label="Buka daftar soal">${s.position+1}/50</button><button type="button" class="primary" data-action="${s.position===49?'finish':'next'}">${s.position===49?'Selesai & nilai':'Berikutnya'}</button></nav></div>`;
    if (focus) { document.getElementById('question-title').focus({preventScroll:true}); window.scrollTo({top:0,behavior:'auto'}); }
  }
  function selectAnswer(value) {
    if (!current) return;
    const s=sessions[current], c=COURSES.get(current), id=s.order[s.position];
    if (s.finished || s.checked[id] || !Number.isInteger(value) || value<0 || value>3) return;
    s.responses[id]=value; save();
    document.querySelectorAll('.choice').forEach(label=>label.classList.toggle('selected',Number(label.querySelector('input').value)===value));
    const button=document.getElementById('check-answer'); if(button)button.disabled=false;
    document.getElementById('answered-count').textContent=`${answered(s)}/50 terjawab`;
    const progress=document.querySelector('[role="progressbar"]'); progress.setAttribute('aria-valuenow',answered(s)); progress.firstElementChild.style.width=answered(s)*2+'%';
    document.querySelectorAll('.map-btn').forEach((button,i)=>{ button.className='map-btn'+mapClass(s,c,s.order[i],i); button.setAttribute('aria-label',`Soal ${i+1}${s.responses[s.order[i]]!==undefined?', terjawab':', belum dijawab'}${s.flags[s.order[i]]?', ditandai':''}`); });
    announce('Jawaban tersimpan.');
  }
  function move(position) {
    if (!current) return;
    const s=sessions[current]; s.position=Math.max(0,Math.min(49,position));save();renderQuiz(current);
  }
  function askFinish() {
    if (!current) return;
    const remaining=50-answered(sessions[current]);
    showDialog(`${dialogHead('Selesaikan latihan?')}<p class="dialog-text">${remaining?`Masih ada <strong>${remaining} soal yang belum dijawab</strong>. Soal kosong akan dihitung sebagai jawaban salah.`:'Semua soal sudah terjawab. Lihat skor, kunci jawaban, dan pembahasan lengkapnya.'}</p><p class="dialog-text">Setelah diselesaikan, jawaban tidak bisa diubah. Kamu tetap bisa memulai latihan baru.</p><div class="dialog-actions"><button type="button" class="secondary" data-action="close">Kembali ke soal</button><button type="button" class="primary" data-action="confirm-finish">Selesaikan & nilai</button></div>`);
  }
  function finish() {
    if (!current) return;
    const code=current; sessions[code].finished=Date.now();save();dialog.close();reviewFilter='wrong';navigate(code+'/hasil');
  }
  function renderResults(code) {
    const c=COURSES.get(code),s=sessions[code];
    if(!s||!s.finished){navigate(code);return;}
    current=code;footer.className='site-footer';
    const correct=score(c,s), blanks=50-answered(s), incorrect=answered(s)-correct;
    const review=s.order.map((id,i)=>({q:question(c,id),i})).filter(({q})=>reviewFilter==='all'||(reviewFilter==='wrong'&&s.responses[q.id]!==undefined&&s.responses[q.id]!==q.answer)||(reviewFilter==='blank'&&s.responses[q.id]===undefined)||(reviewFilter==='flagged'&&s.flags[q.id]));
    main.innerHTML=`${note()}<div class="quiz-wrap"><div class="back-row"><button type="button" class="text-button" data-action="home">Semua mata kuliah</button><span class="pill">${c.code}</span></div><section class="results-hero" aria-labelledby="results-title"><div class="score-ring" style="--score:${correct*2}%"><div class="score-value" id="score-value">${correct*2}<small>dari 100</small></div></div><div><p class="eyebrow">LATIHAN SELESAI</p><h1 id="results-title">${esc(c.name)}</h1><div class="result-stats"><span><strong>${correct}</strong> benar</span><span><strong>${incorrect}</strong> salah</span><span><strong>${blanks}</strong> kosong</span></div><p class="subtle" style="margin-top:12px">Skor latihan = jawaban benar ÷ 50 × 100.</p></div></section><div class="result-actions"><button type="button" class="primary" data-action="setup" data-course="${code}">Latihan lagi</button><button type="button" class="secondary" data-action="home">Pilih mata kuliah</button></div><section aria-labelledby="review-title"><h2 id="review-title">Pelajari pembahasannya</h2><p class="subtle">Kunci, alasan jawaban, dan rujukan tersedia untuk setiap soal.</p><div class="filter-row" role="group" aria-label="Filter pembahasan">${[['wrong',`Salah (${incorrect})`],['blank',`Kosong (${blanks})`],['flagged',`Ditandai (${Object.values(s.flags).filter(Boolean).length})`],['all','Semua (50)']].map(([filter,label])=>`<button type="button" class="filter-btn" data-action="filter" data-filter="${filter}" aria-pressed="${reviewFilter===filter}">${label}</button>`).join('')}</div><div id="review-list">${review.length?review.map(({q,i})=>{
      const a=s.responses[q.id];
      return `<article class="review-card"><div class="review-label"><span>Soal ${i+1} · Sesi ${q.source.session}</span><span>${a===undefined?'Belum dijawab':a===q.answer?'Benar':'Salah'}${s.flags[q.id]?' · Ditandai':''}</span></div><h3>${esc(q.question)}</h3>${s.choices[q.id].map((oi,pos)=>`<p class="answer-line${oi===q.answer?' good':oi===a?' bad':''}"><strong>${LETTERS[pos]}.</strong> ${esc(q.options[oi])}${oi===q.answer?' <strong>· Kunci</strong>':''}${oi===a?' · Jawabanmu':''}</p>`).join('')}${a===undefined?'<p class="answer-line bad">Jawabanmu: kosong.</p>':''}<p class="review-explanation">${esc(q.explanation)}</p>${sourceReference(q)}</article>`;
    }).join(''):'<div class="empty-state">Tidak ada soal pada kategori ini. Pilih “Semua” untuk membaca seluruh pembahasan.</div>'}</div></section></div>`;
    focusMain();
  }
  function showSources() {
    showDialog(`${dialogHead('Rujukan & cakupan')}<p class="dialog-text">Setiap soal merujuk nama berkas, sesi, dan halaman materi Tuton yang sesuai mata kuliahnya. Kasus dan pertanyaan disusun ulang untuk latihan mandiri.</p><p><a class="dialog-link" href="${esc(DATA.catalogueUrl)}" target="_blank" rel="noopener noreferrer">Katalog resmi UT 2026/2027</a></p>${DATA.courses.map(c=>`<section class="source-item"><h3>${c.code} · ${esc(c.name)}</h3><p>${esc(c.reference)}</p><p>${esc(c.coverage)}</p>${c.note?`<p>${esc(c.note)}</p>`:''}</section>`).join('')}<p class="notice">Nomor halaman mengikuti berkas Tuton. Versi framework dan standar mengikuti konteks materi yang disebut dalam soal. Latihan ini tidak menyatakan prediksi soal ujian.</p>${location.protocol!=='file:'?'<a class="secondary" href="./index.html" download="latihan-uas-ut.html">Unduh web untuk offline</a>':''}`);
  }
  function route() {
    if(dialog.open)dialog.close();
    const [code,view]=(location.hash.slice(1)||'home').split('/');
    if(!COURSES.has(code)){renderHome();return;}
    const s=sessions[code];
    if(!s){renderHome();setup(code);return;}
    if(s.finished||view==='hasil'&&s.finished)renderResults(code);else renderQuiz(code);
  }
  document.addEventListener('change',event=>{if(event.target.matches('input[name="answer"]'))selectAnswer(Number(event.target.value));});
  document.addEventListener('submit',event=>{
    if(event.target.id!=='setup-form')return;
    event.preventDefault();const form=event.target;
    start(form.dataset.course,new FormData(form).get('mode'),new FormData(form).has('shuffle'));
  });
  document.addEventListener('click',event=>{
    const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
    const action=button.dataset.action;
    if(action==='home')navigate('home');
    else if(action==='sources')showSources();
    else if(action==='close')dialog.close();
    else if(action==='setup')setup(button.dataset.course);
    else if(action==='resume')navigate(button.dataset.course);
    else if(action==='finish')askFinish();
    else if(action==='confirm-finish')finish();
    else if(action==='previous')move(sessions[current].position-1);
    else if(action==='next')move(sessions[current].position+1);
    else if(action==='jump')move(Number(button.dataset.index));
    else if(action==='map'){
      const map=document.getElementById('question-map');map.open=!map.open;
      if(map.open)map.scrollIntoView({block:'start',behavior:'auto'});
    } else if(action==='flag'){
      const s=sessions[current],id=s.order[s.position];s.flags[id]=!s.flags[id];save();renderQuiz(current,false);
      document.querySelector('[data-action="flag"]').focus({preventScroll:true});
    } else if(action==='check'){
      const s=sessions[current],id=s.order[s.position];if(s.responses[id]===undefined)return;
      s.checked[id]=true;save();renderQuiz(current,false);
      const feedback=document.getElementById('feedback-title');feedback.focus({preventScroll:true});feedback.scrollIntoView({block:'nearest',behavior:'auto'});
    } else if(action==='filter'){
      reviewFilter=button.dataset.filter;renderResults(current);
      document.getElementById('review-title').scrollIntoView({block:'start',behavior:'auto'});
    }
  });
  window.addEventListener('hashchange',route);
  route();
})();
</script>
</body>
</html>
