  <script id="question-data" type="application/json">{"version":"cd70e9d8f91b","catalogueUrl":"https://www.ut.ac.id/wp-content/uploads/2026/06/01-KATALOG-NON-PENDAS-2026-2027-080626_compressed.pdf","courses":[{"code":"STSI4308","name":"Komunikasi Bisnis dan Teknis","reference":"Kode bahan ajar pada katalog UT: SKOM4432, Komunikasi Bisnis (Edisi 4).","coverage":"Materi Tuton sesi 1–8.","note":"","questions":[{"id":"STSI4308-01","question":"Tim pemasaran menyusun kampanye setelah menetapkan sasaran penjualan perusahaan. Unsur komunikasi bisnis yang paling langsung ditunjukkan oleh penyelarasan tersebut adalah …","explanation":"Tujuan komunikasi bisnis harus ditetapkan dan sejalan dengan pencapaian tujuan organisasi.","topic":"Unsur komunikasi bisnis","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 1 - STSI 4308.pdf","session":1,"page":4},"options":["penggunaan simbol yang sama untuk setiap jenis penerima","pemilihan saluran yang selalu bersifat impersonal","pertukaran pesan yang hanya melibatkan pihak internal","tujuan komunikasi yang sejalan dengan pencapaian organisasi"],"answer":3},{"id":"STSI4308-02","question":"Surat undangan rapat tidak memuat tempat dan waktu pelaksanaan sehingga penerima harus bertanya kembali. Prinsip yang paling perlu diperbaiki adalah …","explanation":"Kelengkapan menuntut informasi selengkap mungkin bagi pihak yang membutuhkan. Tempat dan waktu merupakan informasi yang diperlukan penerima undangan.","topic":"Prinsip kelengkapan","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 1 - STSI 4308.pdf","session":1,"page":7},"options":["concreteness, dengan mengganti agenda menjadi istilah teknis","conciseness, dengan menghapus rincian acara yang tersedia","courtesy, dengan mengganti sapaan menjadi lebih hormat","completeness, dengan melengkapi informasi yang dibutuhkan penerima"],"answer":3},{"id":"STSI4308-03","question":"Manajer mengganti instruksi 'tingkatkan pelayanan secepatnya' menjadi instruksi dengan sasaran dan batas waktu yang spesifik. Prinsip komunikasi yang terutama diperkuat ialah …","explanation":"Prinsip concreteness menghendaki pesan yang spesifik dan tidak abstrak. Penetapan sasaran serta batas waktu membuat instruksi lebih konkret.","topic":"Prinsip kekonkretan","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 1 - STSI 4308.pdf","session":1,"page":7},"options":["courtesy karena pesan selalu menggunakan ungkapan penghargaan","completeness karena semua informasi perusahaan sudah dicantumkan","consideration karena pesan selalu dikirim melalui tatap muka","concreteness karena pesan menjadi spesifik dan tidak abstrak"],"answer":3},{"id":"STSI4308-04","question":"Perusahaan menyesuaikan isi pemberitahuan agar sesuai dengan situasi pelanggan yang sedang mengalami gangguan layanan. Prinsip yang menjadi dasar tindakan itu ialah …","explanation":"Consideration menekankan pertimbangan terhadap situasi penerima atau komunikan.","topic":"Prinsip pertimbangan penerima","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 1 - STSI 4308.pdf","session":1,"page":7},"options":["concreteness yang terutama menghindari pernyataan abstrak","consideration yang mempertimbangkan situasi penerima pesan","conciseness yang terutama menuntut pemadatan kalimat","correctness yang terutama menuntut kecermatan tata bahasa"],"answer":1},{"id":"STSI4308-05","question":"Dalam komunikasi bisnis, penggunaan sopan santun dan tata krama terutama merupakan bentuk …","explanation":"Prinsip courtesy menempatkan sopan santun dan tata krama sebagai penghargaan kepada komunikan.","topic":"Prinsip kesantunan","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 1 - STSI 4308.pdf","session":1,"page":7},"options":["penghargaan kepada komunikan yang menerima pesan","penetapan tujuan produktif organisasi secara sepihak","pembatasan saluran komunikasi agar pesan tetap formal","penggantian informasi rinci dengan pesan yang singkat"],"answer":0},{"id":"STSI4308-06","question":"Pernyataan publik perusahaan disampaikan secara keliru dan investor kemudian menafsirkan keadaan perusahaan secara salah. Dampak komunikasi yang ditunjukkan kasus tersebut ialah …","explanation":"Kasus menunjukkan investor salah memahami keadaan perusahaan akibat pernyataan publik yang keliru. Materi mencantumkan mispersepsi terkait investor sebagai salah satu dampak masalah komunikasi tersebut.","topic":"Pentingnya komunikasi bisnis","level":"Analisis","source":{"file":"Materi Inisiasi Sesi 1 - STSI 4308.pdf","session":1,"page":6},"options":["berkurangnya kebutuhan komunikasi manajemen internal","munculnya kesalahpahaman investor tentang keadaan perusahaan","semakin lengkapnya informasi yang diterima seluruh konsumen","meningkatnya ketepatan strategi kampanye produk perusahaan"],"answer":1},{"id":"STSI4308-07","question":"Pasangan yang seluruhnya termasuk ilmu penunjang komunikasi bisnis dalam materi adalah …","explanation":"Bahasa dan psikologi termasuk ilmu penunjang. Pilihan lain merupakan faktor psikologis, keterampilan, atau unsur proses komunikasi.","topic":"Ruang lingkup komunikasi bisnis","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 1 - STSI 4308.pdf","session":1,"page":9},"options":["bahasa dan psikologi","pesan dan komunikan","reputasi dan penampilan","mendengar dan membaca"],"answer":0},{"id":"STSI4308-08","question":"Perusahaan memilih saluran yang memungkinkan pelanggan langsung merespons dan meminta penjelasan. Dimensi saluran yang terutama diprioritaskan adalah …","explanation":"Dimensi umpan balik berhubungan dengan kesempatan penerima untuk merespons secara segera dan maksimal.","topic":"Dimensi umpan balik saluran","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 2- STSI 4308.pdf","session":2,"page":3},"options":["ketersediaan saluran pada suatu wilayah tertentu","daya tahan saluran dalam membawa pesan dari waktu ke waktu","umpan balik saluran yang memungkinkan respons segera","keterlibatan saluran yang menuntut penggunaan semua indera"],"answer":2},{"id":"STSI4308-09","question":"Perbandingan media cetak dengan radio pada materi digunakan untuk menjelaskan dimensi …","explanation":"Materi menempatkan perbandingan media cetak dan radio dalam dimensi daya tahan saluran.","topic":"Dimensi daya tahan saluran","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 2- STSI 4308.pdf","session":2,"page":3},"options":["kredibilitas karena seluruh media cetak selalu lebih dipercaya","daya tahan karena pesan dapat dibawa dari waktu ke waktu","keterlibatan karena media cetak menuntut semua indera","ketersediaan karena radio tidak tersedia pada suatu wilayah"],"answer":1},{"id":"STSI4308-10","question":"Sebuah perusahaan menggabungkan beberapa saluran agar kegiatan komunikasi pada satu saluran didukung oleh saluran lain. Dimensi yang sedang dimanfaatkan ialah …","explanation":"Kesalingmelengkapi menunjukkan kemampuan saluran untuk mendukung kegiatan komunikasi dari saluran lainnya.","topic":"Kesalingmelengkapi saluran","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 2- STSI 4308.pdf","session":2,"page":3},"options":["kredibilitas saluran yang menunjukkan tingkat kepercayaan","kesalingmelengkapi saluran yang mendukung komunikasi saluran lain","keterlibatan saluran yang menunjukkan usaha penggunaan indera","ketersediaan saluran yang menunjukkan keberadaan wilayah"],"answer":1},{"id":"STSI4308-11","question":"Sebelum memakai suatu media, perusahaan memeriksa apakah media itu tersedia di wilayah sasaran. Pemeriksaan ini berkaitan dengan …","explanation":"Ketersediaan saluran secara langsung merujuk pada tersedianya saluran dalam suatu wilayah.","topic":"Ketersediaan saluran","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 2- STSI 4308.pdf","session":2,"page":3},"options":["kredibilitas saluran","daya tahan saluran","umpan balik saluran","ketersediaan saluran"],"answer":3},{"id":"STSI4308-12","question":"Kelompok yang seluruh anggotanya dicantumkan sebagai media internet adalah …","explanation":"Materi mengelompokkan e-mail, e-commerce, dan E-PR sebagai media internet.","topic":"Kelompok media komunikasi","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 2- STSI 4308.pdf","session":2,"page":4},"options":["majalah, televisi, dan e-commerce","surat kabar, majalah, dan e-mail perusahaan","e-mail, e-commerce, dan E-PR","radio, televisi, dan film promosi"],"answer":2},{"id":"STSI4308-13","question":"Perusahaan memakai internet untuk mengerjakan proyek bersama mitra bisnis. Aktivitas pada materi yang paling sesuai dengan penggunaan tersebut ialah …","explanation":"Pengerjaan proyek bersama mitra sesuai dengan aktivitas kolaborasi dengan partner bisnis.","topic":"Aktivitas bisnis melalui internet","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 2- STSI 4308.pdf","session":2,"page":7},"options":["promosi produk dan jasa kepada calon pembeli","rekrutmen calon pegawai untuk kebutuhan internal","media kolaborasi dengan partner bisnis","publikasi perkembangan bisnis kepada pembaca umum"],"answer":2},{"id":"STSI4308-14","question":"Sebuah pengumuman perusahaan disebarkan lewat media massa. Tim berharap dapat segera mengenali setiap pembaca dan memperoleh tanggapannya secara langsung. Penilaian yang paling sesuai materi ialah …","explanation":"Komunikan komunikasi massa bersifat anonim dan heterogen. Umpan baliknya tertunda serta tidak langsung.","topic":"Karakteristik komunikasi massa","level":"Analisis","source":{"file":"Materi Inisiasi Sesi 3 - STSI 4308.pdf","session":3,"page":5},"options":["harapan itu tidak sesuai karena komunikannya anonim dan umpan baliknya tertunda","harapan itu sesuai karena komunikasi massa mengutamakan hubungan pribadi","harapan itu sesuai karena komunikan komunikasi massa bersifat homogen","harapan itu tidak sesuai karena pesan komunikasi massa selalu bersifat rahasia"],"answer":0},{"id":"STSI4308-15","question":"Perusahaan ingin menginformasikan barang dan jasanya kepada publik dengan cakupan sangat luas. Keunggulan bentuk komunikasi yang mendukung tujuan ini ialah …","explanation":"Materi menyebut cakupan publik yang sangat luas sebagai keunggulan komunikasi massa.","topic":"Keunggulan komunikasi massa","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 3 - STSI 4308.pdf","session":3,"page":6},"options":["kedekatan hubungan pribadi sebagai prioritas komunikasi massa","jangkauan publik yang luas pada komunikasi massa","kepastian identitas setiap pembaca pada komunikasi massa","umpan balik cepat dari seluruh penerima komunikasi massa"],"answer":1},{"id":"STSI4308-16","question":"Petugas layanan menjelaskan masalah pesanan kepada seorang pelanggan, lalu pelanggan langsung mengajukan pertanyaan. Bentuk komunikasi yang paling sesuai ialah …","explanation":"Komunikasi interpersonal mencakup penyampaian pesan kepada orang lain atau kelompok kecil dengan peluang umpan balik segera.","topic":"Komunikasi interpersonal","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 3 - STSI 4308.pdf","session":3,"page":7},"options":["komunikasi massa dengan penerima anonim dan beragam","komunikasi kelompok yang wajib melibatkan seluruh divisi","komunikasi interpersonal dengan peluang umpan balik segera","komunikasi visual yang cukup menggunakan foto produk"],"answer":2},{"id":"STSI4308-17","question":"Dua pegawai berbincang ringan untuk menyenangkan satu sama lain dan membangun hubungan informal di kantor. Interaksi itu paling sesuai dengan …","explanation":"Percakapan sosial merupakan interaksi sederhana untuk menyenangkan seseorang dan penting bagi hubungan informal organisasi.","topic":"Klasifikasi komunikasi interpersonal","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 3 - STSI 4308.pdf","session":3,"page":8},"options":["wawancara resmi yang selalu berisi pemeriksaan pekerjaan","percakapan sosial untuk pengembangan hubungan informal","interaksi intim yang mensyaratkan ikatan emosional kuat","interogasi yang menuntut informasi dari pihak lain"],"answer":1},{"id":"STSI4308-18","question":"Situasi yang paling sesuai dengan definisi komunikasi kelompok dalam materi adalah …","explanation":"Komunikasi kelompok melibatkan tiga orang atau lebih secara tatap muka dengan interaksi antaranggota.","topic":"Komunikasi kelompok","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 3 - STSI 4308.pdf","session":3,"page":11},"options":["empat anggota tim bertatap muka dan saling berinteraksi","perusahaan menayangkan iklan kepada penonton anonim","satu pegawai membaca surat pemberitahuan tanpa berinteraksi","dua orang bertukar pesan tertulis melalui surat pribadi"],"answer":0},{"id":"STSI4308-19","question":"Sebuah tim rutin menilai cara kerja dan hasil komunikasinya setelah setiap kegiatan. Indikator efektivitas kelompok yang paling langsung tampak adalah …","explanation":"Penilaian berkesinambungan termasuk indikator efektivitas komunikasi dalam kelompok.","topic":"Efektivitas komunikasi kelompok","level":"Analisis","source":{"file":"Materi Inisiasi Sesi 3 - STSI 4308.pdf","session":3,"page":12},"options":["peniadaan interaksi agar keputusan lebih cepat dibuat","pengutamaan komunikasi satu arah dari pemimpin tetap","penghindaran perumusan tujuan bersama para anggota","penilaian berkesinambungan terhadap proses kelompok"],"answer":3},{"id":"STSI4308-20","question":"Akses internet perusahaan sudah mempercepat pertukaran informasi, tetapi sebagian pegawai menghabiskan jam kerja untuk situs hiburan. Risiko yang sesuai materi ialah …","explanation":"Materi mengaitkan akses situs hiburan saat jam kerja dengan risiko penurunan produktivitas pegawai.","topic":"Kelemahan media internet","level":"Analisis","source":{"file":"Materi Inisiasi Sesi 3 - STSI 4308.pdf","session":3,"page":14},"options":["interaksi pribadi antarpelaku bisnis menjadi mustahil terjadi","informasi tidak lagi dapat disajikan dalam bentuk multimedia","produktivitas pegawai dapat menurun dan merugikan perusahaan","jarak dan waktu kembali menjadi penghalang semua komunikasi"],"answer":2},{"id":"STSI4308-21","question":"Pernyataan yang paling tepat mengenai komunikasi verbal adalah …","explanation":"Komunikasi verbal menggunakan bahasa dalam bentuk lisan maupun tulisan.","topic":"Komunikasi verbal","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 4 - STSI 4308.pdf","session":4,"page":3},"options":["menggunakan bahasa, baik secara lisan maupun tulisan","menggunakan foto dan diagram sebagai satu-satunya pesan","hanya menggunakan gerak tubuh tanpa pertukaran kata","hanya menggunakan kata-kata lisan dalam pertemuan langsung"],"answer":0},{"id":"STSI4308-22","question":"Manajer menghubungi pemasok melalui telepon untuk mendiskusikan jadwal pengiriman. Bentuk komunikasi yang digunakan adalah …","explanation":"Telepon merupakan contoh komunikasi lisan. Pesan dipertukarkan melalui kata-kata yang diucapkan.","topic":"Komunikasi lisan","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 4 - STSI 4308.pdf","session":4,"page":4},"options":["komunikasi lisan karena pertukaran memakai kata yang diucapkan","komunikasi tertulis karena melibatkan informasi jadwal","komunikasi artifaktual karena memakai perangkat telepon","komunikasi visual karena membahas barang kiriman"],"answer":0},{"id":"STSI4308-23","question":"Direktur menerbitkan surat keputusan untuk memberitahukan perubahan penugasan. Surat tersebut termasuk …","explanation":"Surat keputusan disebut sebagai contoh komunikasi tertulis.","topic":"Komunikasi tertulis","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 4 - STSI 4308.pdf","session":4,"page":4},"options":["komunikasi tertulis dengan kata-kata yang ditulis","komunikasi lisan dengan kata-kata yang diucapkan","pesan nonverbal yang tidak melibatkan kata tertulis","pesan kinesik yang terutama menggunakan postur tubuh"],"answer":0},{"id":"STSI4308-24","question":"Pembeda utama komunikasi nonverbal pada materi terletak pada …","explanation":"Komunikasi nonverbal menekankan tindakan serta atribusi lebih dari penggunaan kata-kata dalam pertukaran makna.","topic":"Makna komunikasi nonverbal","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 4 - STSI 4308.pdf","session":4,"page":5},"options":["kewajiban memakai surat yang mempunyai kekuatan hukum","pembatasan penerima pesan hanya pada kalangan manajemen","penghilangan tujuan dan umpan balik dari pertukaran makna","tindakan dan atribusi yang melampaui penggunaan kata-kata"],"answer":3},{"id":"STSI4308-25","question":"Menurut klasifikasi dalam materi, pesan fasial, gestural, dan postural termasuk kelompok …","explanation":"Materi secara langsung mengelompokkan fasial, gestural, dan postural sebagai pesan kinesik.","topic":"Klasifikasi pesan kinesik","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 4 - STSI 4308.pdf","session":4,"page":6},"options":["pesan paralinguistik yang ditempatkan sebagai kategori tersendiri","pesan kinesik dalam klasifikasi komunikasi nonverbal","pesan artifaktual dalam klasifikasi komunikasi nonverbal","pesan proksemik yang ditempatkan sebagai kategori tersendiri"],"answer":1},{"id":"STSI4308-26","question":"Perusahaan menambahkan foto produk dan diagram pada materi promosi. Hubungan tindakan ini dengan komunikasi visual adalah …","explanation":"Komunikasi visual mengeksplorasi ide dengan gambar, termasuk foto dan diagram. Salah satu fungsinya adalah presentasi dan promosi.","topic":"Fungsi komunikasi visual","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 4 - STSI 4308.pdf","session":4,"page":7},"options":["promosi hanya dapat dijalankan melalui komunikasi lisan","diagram termasuk komunikasi verbal karena selalu menggantikan tulisan","foto dan diagram menghapus fungsi informasi dalam komunikasi","gambar mendukung eksplorasi ide serta fungsi presentasi dan promosi"],"answer":3},{"id":"STSI4308-27","question":"Sebuah kelompok terdampak oleh tindakan bisnis perusahaan meskipun tidak mengelola perusahaan tersebut. Berdasarkan definisi materi, kelompok itu …","explanation":"Stakeholder mencakup pihak yang dapat memengaruhi atau dipengaruhi oleh tindakan bisnis secara keseluruhan.","topic":"Pengertian stakeholder","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 5 - STSI4308.pdf","session":5,"page":3},"options":["hanya disebut stakeholder jika menjadi pemilik saham","hanya disebut stakeholder jika bekerja dalam perusahaan","dapat disebut stakeholder karena dipengaruhi tindakan bisnis","tidak dapat disebut stakeholder tanpa jabatan manajemen"],"answer":2},{"id":"STSI4308-28","question":"Perusahaan menilai bahwa tanpa partisipasi berkelanjutan dari suatu pihak, organisasi tidak dapat berjalan. Pihak tersebut dikelompokkan sebagai …","explanation":"Ciri stakeholder primer adalah partisipasi berkelanjutan yang diperlukan agar organisasi dapat berjalan.","topic":"Stakeholder primer","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 5 - STSI4308.pdf","session":5,"page":4},"options":["stakeholder eksternal hanya karena berada di luar manajemen","stakeholder sekunder karena tidak menentukan kelangsungan hidup","stakeholder primer karena partisipasinya diperlukan organisasi","stakeholder media karena memengaruhi informasi publik"],"answer":2},{"id":"STSI4308-29","question":"Keterangan yang sesuai dengan stakeholder sekunder dalam materi adalah …","explanation":"Stakeholder sekunder memengaruhi atau dipengaruhi perusahaan, tetapi tidak terlibat transaksi dengannya.","topic":"Stakeholder sekunder","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 5 - STSI4308.pdf","session":5,"page":4},"options":["hanya terdiri atas pemilik dan pekerja perusahaan yang bersangkutan","tidak pernah memengaruhi dan tidak pernah dipengaruhi perusahaan","selalu terlibat transaksi rutin dan menentukan operasi perusahaan","memengaruhi atau dipengaruhi perusahaan tetapi tidak terlibat transaksi dengannya"],"answer":3},{"id":"STSI4308-30","question":"Tim komunikasi ingin mengadakan pertemuan khusus untuk stakeholder internal. Kelompok undangan yang tepat menurut materi ialah …","explanation":"Materi menempatkan pemilik, manajemen, dan karyawan sebagai stakeholder internal.","topic":"Stakeholder internal","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 5 - STSI4308.pdf","session":5,"page":5},"options":["regulator, pemasok, dan pelanggan","manajemen, regulator, dan penyalur","pemilik, manajemen, dan karyawan","pelanggan, penyalur, dan pemasok"],"answer":2},{"id":"STSI4308-31","question":"Kelompok yang seluruh anggotanya dicantumkan sebagai stakeholder eksternal adalah …","explanation":"Pelanggan, penyalur, regulator, dan pemasok dicantumkan sebagai stakeholder eksternal.","topic":"Stakeholder eksternal","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 5 - STSI4308.pdf","session":5,"page":5},"options":["karyawan, pelanggan, dan pemilik","pelanggan, regulator, dan pemasok","pemilik, penyalur, dan manajemen","pemilik, manajemen, dan karyawan"],"answer":1},{"id":"STSI4308-32","question":"Sebelum merancang pesan, perusahaan memetakan khalayak berdasarkan demografi dan lokasi geografis. Aspek ketiga yang disebut materi untuk melengkapi pemetaan itu adalah …","explanation":"Materi menyebut demografis, lokasi geografis, dan psikodemografis sebagai aspek pemetaan karakteristik khalayak.","topic":"Pemetaan khalayak komunikasi","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 5 - STSI4308.pdf","session":5,"page":6},"options":["jenis surat yang digunakan untuk berkorespondensi","psikodemografis sebagai karakteristik khalayak","kecepatan pengiriman pesan kepada seluruh khalayak","daya tahan media yang dipakai untuk membawa pesan"],"answer":1},{"id":"STSI4308-33","question":"Tindakan yang paling sesuai dengan esensi lobi dalam materi adalah …","explanation":"Esensi lobi adalah mengupayakan sesuatu berjalan melalui persuasi, bukan pemberian perintah atau cara koersif.","topic":"Esensi lobi","level":"Pemahaman","source":{"file":"Materi Inisiasi 6 - STSI 4308.pdf","session":6,"page":3},"options":["memerintahkan pihak lain menerima usulan melalui kewenangan jabatan","menghapus komunikasi agar keputusan dapat dibuat secara sepihak","meyakinkan pihak lain melalui persuasi agar tujuan dapat berjalan","memaksa pihak lain mengikuti keputusan dengan ancaman hukuman"],"answer":2},{"id":"STSI4308-34","question":"Pelobi mengajak masyarakat menyampaikan aspirasinya kepada pengambil keputusan sehingga pengaruh diberikan secara tidak langsung. Jenis lobi ini ialah …","explanation":"Lobi akar rumput memengaruhi masyarakat agar menyampaikan aspirasi kepada pengambil keputusan.","topic":"Lobi akar rumput","level":"Penerapan","source":{"file":"Materi Inisiasi 6 - STSI 4308.pdf","session":6,"page":4},"options":["lobi tradisional yang mengandalkan figur publik untuk mendekati kelompok kepentingan","lobi akar rumput yang memengaruhi masyarakat untuk menyampaikan aspirasi","lobi tradisional yang semata-mata mengganti keputusan melalui perintah","lobi political action committee yang menempatkan calon pada lembaga negara"],"answer":1},{"id":"STSI4308-35","question":"Dua perusahaan bertemu untuk merundingkan persoalan kepentingan yang bertentangan dan mencari kesepakatan bersama. Fungsi negosiasi yang tampak ialah …","explanation":"Fungsi negosiasi adalah menyelesaikan konflik kepentingan atau persoalan melalui tindak komunikasi.","topic":"Fungsi negosiasi","level":"Penerapan","source":{"file":"Materi Inisiasi 6 - STSI 4308.pdf","session":6,"page":6},"options":["meniadakan perundingan agar satu pihak menetapkan hasil","mendistribusikan pesan umum kepada khalayak yang anonim","memengaruhi keputusan hanya melalui tokoh terkenal","menyelesaikan konflik kepentingan melalui tindak komunikasi"],"answer":3},{"id":"STSI4308-36","question":"Dua pihak memilih jalan tengah. Masing-masing mempertahankan sebagian kepentingannya dan mengorbankan sebagian yang lain. Pendekatan ini merupakan …","explanation":"Kompromi adalah pemilihan jalan tengah dengan kepentingan yang dipertahankan serta dikorbankan oleh kedua pihak.","topic":"Negosiasi kompromi","level":"Penerapan","source":{"file":"Materi Inisiasi 6 - STSI 4308.pdf","session":6,"page":7},"options":["negosiasi bargaining karena hanya satu pihak yang mencapai tujuan","negosiasi kompromi karena ada kepentingan yang dipertahankan dan dikorbankan","negosiasi kalah-kalah karena keduanya mengabaikan kemungkinan menang","negosiasi menang-menang karena tidak ada kebutuhan yang dikorbankan"],"answer":1},{"id":"STSI4308-37","question":"Sebuah hasil perundingan memenuhi kebutuhan semua pihak sehingga setiap pihak tidak merasa dirugikan. Hasil ini paling sesuai dengan orientasi …","explanation":"Orientasi menang-menang mencari pemecahan yang memuaskan kebutuhan semua pihak sehingga mereka tidak merasa dirugikan.","topic":"Negosiasi menang-menang","level":"Analisis","source":{"file":"Materi Inisiasi 6 - STSI 4308.pdf","session":6,"page":7},"options":["menang-menang yang memuaskan kebutuhan seluruh pihak","kalah-kalah yang membuat para perunding menjadi pecundang","kompromi yang selalu mewajibkan setiap kebutuhan dilepaskan","bargaining yang memberikan kemenangan hanya kepada satu pihak"],"answer":0},{"id":"STSI4308-38","question":"Organisasi mengajak berbagai kelompok yang sepakat dengan usulannya untuk mendukung upaya lobi. Teknik yang paling langsung digunakan ialah …","explanation":"Membentuk koalisi dengan berbagai kelompok yang setuju merupakan salah satu teknik lobi dalam materi.","topic":"Teknik lobi","level":"Penerapan","source":{"file":"Materi Inisiasi 6 - STSI 4308.pdf","session":6,"page":9},"options":["mengidentifikasi iklim pokok masalah secara mandiri","menganalisis penyebab kasus yang muncul","memperhitungkan media dan saluran komunikasi","membentuk koalisi dengan kelompok yang setuju"],"answer":3},{"id":"STSI4308-39","question":"Seorang pegawai sedang menentukan tujuan, menganalisis audiens, menetapkan ide pokok, dan memilih media. Ia berada pada tahap …","explanation":"Penentuan tujuan, analisis audiens, penentuan ide pokok, serta pemilihan saluran dan media termasuk perencanaan pesan.","topic":"Perencanaan pesan bisnis","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 7  - STSI 4308.pdf","session":7,"page":5},"options":["penyusunan pesan bisnis untuk memformulasikan kalimat","pencetakan pesan bisnis sebagai hasil penyuntingan akhir","revisi pesan bisnis untuk menyunting dan menulis ulang","perencanaan pesan bisnis sebelum pesan disusun"],"answer":3},{"id":"STSI4308-40","question":"Setelah draf selesai, penulis menyunting dan menulis ulang pesan agar lebih baik. Kegiatan ini termasuk tahap …","explanation":"Menyunting dan menulis ulang pesan tercantum pada tahap revisi pesan bisnis.","topic":"Revisi pesan bisnis","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 7  - STSI 4308.pdf","session":7,"page":5},"options":["analisis awal audiens","revisi pesan bisnis","pemilihan awal saluran","penentuan tujuan pesan"],"answer":1},{"id":"STSI4308-41","question":"Kantor pusat berkirim surat resmi kepada kantor cabangnya mengenai pelaksanaan kegiatan. Berdasarkan cakupan hubungan, surat tersebut termasuk …","explanation":"Korespondensi intern digunakan antarunit kerja dalam organisasi, termasuk kantor pusat dengan cabangnya.","topic":"Korespondensi intern","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 7  - STSI 4308.pdf","session":7,"page":6},"options":["korespondensi ekstern karena kedua kantor terpisah lokasi","korespondensi intern hanya jika ditujukan kepada pemasok organisasi","korespondensi intern karena menghubungkan unit dalam satu organisasi","korespondensi ekstern karena semua surat bersifat resmi"],"answer":2},{"id":"STSI4308-42","question":"Pilihan bahasa korespondensi yang paling sesuai dengan materi ialah …","explanation":"Materi menetapkan bahasa korespondensi yang jelas, lugas, menarik, dan santun.","topic":"Bahasa korespondensi","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 7  - STSI 4308.pdf","session":7,"page":8},"options":["sangat singkat meskipun maksud surat menjadi sulit dipahami","penuh ungkapan resmi meskipun mengaburkan pesan utama","jelas, lugas, serta menarik dan santun","abstrak, berputar-putar, dan menonjolkan istilah yang sulit"],"answer":2},{"id":"STSI4308-43","question":"Perusahaan mengirim ucapan selamat dan penghargaan kepada mitra yang berhasil meraih prestasi. Bentuk pesan tersebut ialah …","explanation":"Ucapan selamat dan penghargaan merupakan contoh pesan goodwill.","topic":"Pesan goodwill","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 7  - STSI 4308.pdf","session":7,"page":9},"options":["pesan goodwill yang membangun kesan positif","pesan good news yang terbatas pada keluhan perusahaan","pesan bad news yang menyampaikan penolakan kepada mitra","pesan pemeriksaan yang menuntut jawaban dari mitra"],"answer":0},{"id":"STSI4308-44","question":"Perusahaan ingin menyampaikan penolakan dengan pendekatan tidak langsung. Urutan yang sesuai materi adalah …","explanation":"Pendekatan tidak langsung diawali pernyataan netral, diikuti alasan logis, penyampaian bad news, dan penutup positif serta bersahabat.","topic":"Pendekatan tidak langsung bad news","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 7  - STSI 4308.pdf","session":7,"page":10},"options":["pernyataan netral, alasan logis, bad news, lalu penutup positif dan bersahabat","penutup bersahabat, bad news, lalu penghilangan alasan","alasan logis, penutup positif, lalu pembuka dan bad news","pernyataan bad news, tuntutan penerima, lalu pembuka netral"],"answer":0},{"id":"STSI4308-45","question":"Presentasi bisnis kepada pengambil keputusan terutama berfungsi untuk …","explanation":"Materi menyebut fungsi presentasi bisnis untuk menyampaikan informasi dan memengaruhi pengambil keputusan.","topic":"Fungsi presentasi bisnis","level":"Pemahaman","source":{"file":"Materi Inisiasi Sesi 8 - STSI 4308.pptx","session":8,"page":3},"options":["menyampaikan informasi dan memengaruhi pengambil keputusan","membatasi penyajian proposal hanya kepada satu tingkat jabatan","menghilangkan kebutuhan khalayak untuk menanggapi proposal","menggantikan seluruh kegiatan bisnis dengan hiburan bagi audiens"],"answer":0},{"id":"STSI4308-46","question":"Dibandingkan korespondensi, presentasi memungkinkan tanggapan diterima lebih cepat sehingga waktu dapat dihemat. Keunggulan yang paling langsung ditunjukkan adalah …","explanation":"Efisiensi presentasi dikaitkan dengan penghematan waktu, terutama kecepatan menerima tanggapan dibanding korespondensi.","topic":"Efisiensi presentasi","level":"Analisis","source":{"file":"Materi Inisiasi Sesi 8 - STSI 4308.pptx","session":8,"page":4},"options":["pengaruh karena media lisan selalu menghilangkan perbedaan pendapat","efisiensi karena penyaji tidak perlu menyiapkan materi","efisiensi karena menghemat waktu penerimaan tanggapan","efektivitas karena tidak ada umpan balik nonverbal"],"answer":2},{"id":"STSI4308-47","question":"Penyaji memperhatikan jawaban lisan dan reaksi nonverbal audiens lalu berinteraksi dengan mereka. Keunggulan presentasi yang dimanfaatkan adalah …","explanation":"Efektivitas presentasi antara lain berasal dari kesempatan berinteraksi dan mengamati umpan balik verbal maupun nonverbal.","topic":"Efektivitas presentasi","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 8 - STSI 4308.pptx","session":8,"page":4},"options":["efektivitas melalui interaksi dan pengamatan umpan balik","penundaan tanggapan agar presentasi selalu berlangsung satu arah","penghilangan kebutuhan untuk mengenali respons audiens","pembatasan interaksi supaya proposal tidak berubah"],"answer":0},{"id":"STSI4308-48","question":"Dengan acuan kecepatan rata-rata 100 kata per menit pada materi, jumlah kata untuk presentasi selama delapan menit kira-kira adalah …","explanation":"Materi memberikan acuan 100 kata per menit. Delapan menit setara dengan sekitar 800 kata.","topic":"Perkiraan panjang presentasi","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 8 - STSI 4308.pptx","session":8,"page":6},"options":["100 kata untuk keseluruhan waktu delapan menit","1.600 kata untuk keseluruhan waktu delapan menit","400 kata untuk keseluruhan waktu delapan menit","800 kata untuk keseluruhan waktu delapan menit"],"answer":3},{"id":"STSI4308-49","question":"Penyaji sudah menguasai materi dan alat bantu. Agar persiapannya mencakup unsur lain pada materi, ia perlu …","explanation":"Selain menguasai materi dan alat bantu, persiapan presentasi mencakup analisis audiens serta lingkungan lokasi.","topic":"Persiapan presentasi","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 8 - STSI 4308.pptx","session":8,"page":7},"options":["memilih lokasi setelah seluruh peserta selesai mengikuti presentasi","menganalisis audiens serta lingkungan lokasi presentasi","mengganti analisis audiens dengan menambah sebanyak mungkin istilah teknis","mengurangi penguasaan materi agar presentasi terasa lebih spontan"],"answer":1},{"id":"STSI4308-50","question":"Sebuah presentasi membagi durasi menjadi pembukaan 15%, isi 70%, dan penutup 15%. Penilaian yang sesuai rentang format pada materi adalah …","explanation":"Materi memberi rentang pembukaan 10–20%, isi 65–75%, dan penutup 10–20%. Pembagian 15%, 70%, dan 15% memenuhi ketiganya.","topic":"Format presentasi","level":"Penerapan","source":{"file":"Materi Inisiasi Sesi 8 - STSI 4308.pptx","session":8,"page":8},"options":["pembagian sesuai karena ketiga bagian berada dalam rentang yang disarankan","pembagian tidak sesuai karena isi seharusnya lebih singkat daripada pembukaan","pembagian tidak sesuai karena penutup wajib mengambil setengah waktu","pembagian sesuai hanya jika pembukaan dan penutup dihapus"],"answer":0}]},{"code":"STSI4402","name":"Tata Kelola Teknologi Informasi","reference":"Kode bahan ajar pada katalog UT: MSIM4402, Tata Kelola Teknologi Informasi.","coverage":"Materi Tuton sesi 1–8.","note":"","questions":[{"id":"STSI4402-01","question":"Perusahaan meninjau dampak perubahan aturan pemerintah terhadap layanan digitalnya. Kekuatan lingkungan bisnis mana yang terutama sedang dianalisis?","explanation":"Perubahan aturan pemerintah termasuk kekuatan politik dan regulasi dalam lingkungan bisnis.","topic":"Lingkungan bisnis","level":"Penerapan","source":{"file":"Inisiasi 1-MSIM4402.pdf","session":1,"page":3},"options":["Kompetitif","Alam","Sosial dan budaya","Politik dan regulasi"],"answer":3},{"id":"STSI4402-02","question":"Unit TI memilih proyek paling canggih, tetapi proyek itu tidak mendukung sasaran perusahaan. Perbaikan yang paling sesuai dengan tata kelola TI adalah ...","explanation":"Tata kelola TI menekankan penyelarasan strategis tujuan bisnis dan pemanfaatan sumber daya TI untuk mencapai hasil yang diinginkan.","topic":"Penyelarasan bisnis dan TI","level":"Analisis","source":{"file":"Inisiasi 1-MSIM4402.pdf","session":1,"page":5},"options":["Memindahkan penetapan sasaran perusahaan sepenuhnya kepada vendor TI","Menyelaraskan pemanfaatan sumber daya TI dengan tujuan bisnis yang ingin dicapai","Menilai proyek hanya dari kecepatan pemasangan perangkat","Menetapkan kecanggihan teknologi sebagai dasar utama pemilihan proyek"],"answer":1},{"id":"STSI4402-03","question":"Kombinasi tujuan apa yang diintegrasikan dalam tata kelola TI menurut materi?","explanation":"Materi mengintegrasikan tujuan strategis, efisiensi, pengukuran yang andal dan objektif, serta manajemen kepatuhan.","topic":"Tujuan tata kelola TI","level":"Pemahaman","source":{"file":"Inisiasi 1-MSIM4402.pdf","session":1,"page":6},"options":["Pencapaian tujuan strategis, efisiensi, pengukuran andal dan objektif, serta manajemen kepatuhan","Pencapaian tujuan strategis, efisiensi, jumlah perangkat baru, dan promosi produk","Pengukuran objektif, ekspansi pasar, pengalihan keputusan bisnis, dan efisiensi","Efisiensi, kepatuhan, penyeragaman seluruh teknologi, dan penghapusan seluruh risiko"],"answer":0},{"id":"STSI4402-04","question":"Tim mulai menyusun daftar ancaman beserta dokumentasinya sebelum mengevaluasi cara penanganan. Tahap manajemen risiko yang sedang dilakukan adalah ...","explanation":"Identifikasi risiko bertujuan menentukan dan mendokumentasikan risiko. Evaluasi dan pemilihan pendekatan penanganan merupakan kegiatan berikutnya.","topic":"Manajemen risiko","level":"Penerapan","source":{"file":"Inisiasi 1-MSIM4402.pdf","session":1,"page":7},"options":["Respons risiko","Kuantifikasi risiko","Pemindahan risiko","Identifikasi risiko"],"answer":3},{"id":"STSI4402-05","question":"Setelah risiko dievaluasi, perusahaan memilih pendekatan penghindaran, pengurangan, pemindahan, atau retensi. Kegiatan ini termasuk ...","explanation":"Respons risiko memilih pendekatan untuk mengatasi ancaman, termasuk penghindaran, pengurangan, pemindahan, atau retensi.","topic":"Respons risiko","level":"Penerapan","source":{"file":"Inisiasi 1-MSIM4402.pdf","session":1,"page":7},"options":["Respons risiko","Identifikasi risiko","Pengukuran kinerja sistem","Penyusunan struktur organisasi"],"answer":0},{"id":"STSI4402-06","question":"Sebuah unit berhasil memenuhi banyak prosedur dan menaikkan produktivitas lokal, tetapi kepentingan pelanggan terabaikan dan proses bisnis keseluruhan memburuk. Penilaian yang paling tepat adalah ...","explanation":"Materi menyebut pengabaian kepentingan pelanggan sebagai ciri tata kelola yang buruk. Keuntungan efisiensi lokal juga belum tentu menguntungkan proses bisnis secara keseluruhan.","topic":"Kualitas tata kelola TI","level":"Analisis","source":{"file":"Inisiasi 1-MSIM4402.pdf","session":1,"page":9},"options":["Tata kelolanya telah efektif karena jumlah prosedur yang dipenuhi menjadi ukuran tunggal","Tata kelolanya perlu diperbaiki karena kepatuhan lokal belum menjamin hasil bisnis keseluruhan","Kepentingan pelanggan baru perlu ditinjau setelah semua aturan ditambah","Kinerja bisnis keseluruhan tidak relevan selama produktivitas satu unit meningkat"],"answer":1},{"id":"STSI4402-07","question":"CIO baru hendak memperkuat tata kelola TI perusahaan. Tugas pertama dan utama yang ditekankan materi adalah ...","explanation":"Pemahaman mendalam atas bisnis adalah tugas pertama eksekutif terkait tata kelola TI. Membangun kredibilitas direktorat SI disebut sebagai tugas kedua CIO.","topic":"Peran CIO","level":"Penerapan","source":{"file":"Inisiasi 1-MSIM4402.pdf","session":1,"page":11},"options":["Mengubah seluruh fungsi TI menjadi terdesentralisasi","Mengganti teknologi yang paling lama digunakan","Memahami bisnis perusahaan secara menyeluruh dan mendetail","Membangun kredibilitas direktorat SI sebelum mempelajari bisnis"],"answer":2},{"id":"STSI4402-08","question":"Apa ciri tata kelola yang ditekankan dalam definisi pada materi sesi 2?","explanation":"Tata kelola mengaitkan manajemen, perencanaan, pelaporan, dan tinjauan kinerja dengan hak keputusan, kontrol, serta metrik kinerja.","topic":"Hak keputusan dan kontrol","level":"Pemahaman","source":{"file":"Inisiasi 2-MSIM4402.pdf","session":2,"page":2},"options":["Pencatatan aset yang tidak mengatur hak keputusan dan pelaporan kinerja","Pemeriksaan teknis yang terpisah dari penilaian investasi dan kepatuhan","Otorisasi proyek menurut biaya tanpa kontrol maupun metrik kinerja","Proses dengan hak keputusan yang saling terkait serta kontrol dan metrik kinerja"],"answer":3},{"id":"STSI4402-09","question":"Permintaan layanan TI tertunda karena beberapa unit saling menunggu persetujuan. Sasaran tata kelola apa yang paling langsung menjawab persoalan ini?","explanation":"Kejelasan akuntabilitas dan hak keputusan mengurangi ketidakjelasan siapa yang harus memutuskan. Materi secara eksplisit menghubungkannya dengan definisi peran dan wewenang.","topic":"Akuntabilitas tata kelola","level":"Penerapan","source":{"file":"Inisiasi 2-MSIM4402.pdf","session":2,"page":3},"options":["Mengevaluasi semua permintaan hanya berdasarkan biaya perangkat","Membatasi komunikasi antarpihak hingga layanan selesai","Menjelaskan akuntabilitas, peran, wewenang, dan hak keputusan pihak yang terlibat","Menambah jumlah aplikasi sebelum memperjelas penanggung jawab"],"answer":2},{"id":"STSI4402-10","question":"Manakah yang termasuk komponen lingkungan kontrol dalam kerangka COSO pada materi?","explanation":"Komitmen terhadap kompetensi tercantum sebagai komponen lingkungan kontrol COSO, bersama struktur organisasi serta penugasan otoritas dan tanggung jawab.","topic":"Lingkungan kontrol COSO","level":"Pemahaman","source":{"file":"Inisiasi 2-MSIM4402.pdf","session":2,"page":4},"options":["Virtualisasi aplikasi","Komitmen terhadap kompetensi","Pemisahan data cloud","Kapasitas beban puncak"],"answer":1},{"id":"STSI4402-11","question":"Untuk mengurangi penumpukan kewenangan pada satu orang, perusahaan membagi pelaksanaan beberapa tugas kepada petugas berbeda. Aktivitas pengendalian COSO yang paling sesuai adalah ...","explanation":"Pemisahan tugas merupakan salah satu aktivitas pengendalian dalam COSO yang dicantumkan materi.","topic":"Aktivitas pengendalian COSO","level":"Penerapan","source":{"file":"Inisiasi 2-MSIM4402.pdf","session":2,"page":6},"options":["Pengembangan arsitektur layanan","Pembuatan versi dokumen","Penetapan lokasi data","Pemisahan tugas"],"answer":3},{"id":"STSI4402-12","question":"Pasangan kegiatan mana yang disebut dalam proses evaluasi pengendalian internal?","explanation":"Materi menyebut evaluasi rencana tindakan dan pelaporan defisiensi pengendalian internal sebagai bagian proses evaluasi.","topic":"Evaluasi pengendalian internal","level":"Pemahaman","source":{"file":"Inisiasi 2-MSIM4402.pdf","session":2,"page":5},"options":["Menetapkan layanan SOA dan memilih produk ERP","Mengevaluasi rencana tindakan dan melaporkan defisiensi pengendalian internal","Mengubah lokasi data dan memperbesar bandwidth jaringan","Memindai dokumen dan menetapkan kebijakan retensi"],"answer":1},{"id":"STSI4402-13","question":"Laporan pengendalian sudah akurat, tetapi baru disampaikan setelah petugas harus mengambil tindakan. Kekurangan utama menurut prinsip informasi dan komunikasi adalah ...","explanation":"Informasi yang sesuai perlu dikomunikasikan ke atas dan ke bawah dalam cara dan kerangka waktu yang memungkinkan pelaksanaan tanggung jawab.","topic":"Informasi dan komunikasi","level":"Analisis","source":{"file":"Inisiasi 2-MSIM4402.pdf","session":2,"page":7},"options":["Informasi perlu disimpan sampai semua periode pelaporan tahunan ditutup","Akurasi informasi sudah cukup sehingga kerangka waktu tidak perlu diatur","Komunikasi ke bawah dapat digantikan sepenuhnya dengan penyimpanan arsip","Waktu penyampaian belum memungkinkan orang melaksanakan tanggung jawabnya"],"answer":3},{"id":"STSI4402-14","question":"Kegiatan manakah yang dicontohkan sebagai penerapan COBIT 5 dalam materi?","explanation":"Audit SI adalah salah satu contoh penerapan COBIT 5 dalam materi, bersama penilaian kapabilitas proses TI, pengembangan kebijakan, dan evaluasi risiko serta pengendalian internal.","topic":"Penerapan COBIT","level":"Pemahaman","source":{"file":"Inisiasi 3-MSIM4402.pdf","session":3,"page":3},"options":["Penggantian kabel jaringan berkala","Audit SI","Pembuatan gambar promosi produk","Perakitan komponen komputer"],"answer":1},{"id":"STSI4402-15","question":"Saat merancang tata kelola, tim menilai kebutuhan dan manfaat yang diharapkan para pemangku kepentingan. Prinsip COBIT dalam materi yang paling dekat dengan langkah ini adalah ...","explanation":"Sesi 3 menyebut Driver Nilai Pemangku Kepentingan sebagai salah satu dari lima prinsip COBIT yang disajikan.","topic":"Prinsip COBIT dalam materi","level":"Penerapan","source":{"file":"Inisiasi 3-MSIM4402.pdf","session":3,"page":6},"options":["Struktur Pengukuran Kinerja Tata Kelola dan Manajemen","Driver Nilai Pemangku Kepentingan","Membangun Kerangka Arsitektur IT yang Terintegrasi","Tata Kelola dan Pengendali Manajemen Risiko"],"answer":1},{"id":"STSI4402-16","question":"Direksi ingin menilai keberhasilan investasi TI menggunakan tujuan COBIT 5. Pertanyaan evaluasi yang paling sesuai adalah ...","explanation":"COBIT 5 ditujukan untuk menyelaraskan TI dengan kebutuhan bisnis dan memaksimalkan manfaat investasi TI, bukan sekadar menambah perangkat.","topic":"Tujuan COBIT 5","level":"Analisis","source":{"file":"Inisiasi 3-MSIM4402.pdf","session":3,"page":7},"options":["Apakah ukuran keberhasilan cukup berupa jumlah perangkat yang dibeli?","Apakah TI selaras dengan kebutuhan bisnis dan memberikan manfaat maksimal dari investasinya?","Apakah seluruh investasi menggunakan teknologi dengan versi paling baru?","Apakah pengembangan aplikasi dapat dilepaskan dari proses bisnis?"],"answer":1},{"id":"STSI4402-17","question":"Perspektif utama ITSM dalam mengelola sistem TI menurut materi adalah ...","explanation":"ITSM berpusat pada perspektif pelanggan tentang kontribusi TI terhadap bisnis.","topic":"Orientasi ITSM","level":"Pemahaman","source":{"file":"Inisiasi 3-MSIM4402.pdf","session":3,"page":8},"options":["Perspektif pelanggan mengenai kontribusi TI terhadap bisnis","Perspektif pengembang mengenai bahasa pemrograman favorit","Perspektif teknisi mengenai usia fisik perangkat","Perspektif pemasok mengenai jumlah perangkat yang dijual"],"answer":0},{"id":"STSI4402-18","question":"Aplikasi peramalan anggaran telah selesai dibangun, tetapi pengguna kesulitan melaporkan gangguan. Kebutuhan pendukung yang paling langsung belum terpenuhi adalah ...","explanation":"Contoh materi menegaskan perlunya manajemen masalah dan insiden agar pengguna aplikasi peramalan anggaran dapat melaporkan kesulitan sistem.","topic":"Dukungan layanan TI","level":"Analisis","source":{"file":"Inisiasi 3-MSIM4402.pdf","session":3,"page":9},"options":["Penambahan fitur peramalan sebelum saluran gangguan dibuka","Pembaruan kode etik vendor","Proses manajemen masalah dan insiden","Penggantian seluruh sasaran bisnis"],"answer":2},{"id":"STSI4402-19","question":"Perusahaan mengurangi pengerjaan ulang, waktu yang hilang, dan pemborosan sumber daya melalui praktik ITIL. Manfaat yang paling langsung tercapai adalah ...","explanation":"Materi menghubungkan pengurangan pengerjaan ulang dan waktu yang hilang serta pengelolaan sumber daya yang lebih baik dengan penghematan finansial.","topic":"Manfaat ITIL","level":"Penerapan","source":{"file":"Inisiasi 3-MSIM4402.pdf","session":3,"page":10},"options":["Pemindahan tanggung jawab bisnis ke vendor","Penghematan finansial","Peningkatan kompleksitas persetujuan","Perubahan visi perusahaan"],"answer":1},{"id":"STSI4402-20","question":"Toko daring mengalami lonjakan transaksi bersamaan pada periode promosi. Manfaat komputasi awan yang paling sesuai dengan kebutuhan ini adalah ...","explanation":"Salah satu manfaat cloud dalam materi ialah peningkatan kapasitas beban ketika transaksi berjalan bersamaan.","topic":"Manfaat komputasi awan","level":"Penerapan","source":{"file":"Inisiasi 4-MSIM4402.pdf","session":4,"page":2},"options":["Peningkatan kapasitas beban ketika banyak transaksi berjalan bersamaan","Penghapusan kebutuhan pemantauan kinerja sistem","Penggantian seluruh proses layanan dengan dokumen fisik","Pemisahan seluruh proses bisnis dari dukungan TI"],"answer":0},{"id":"STSI4402-21","question":"Sebelum memilih penyedia cloud, perusahaan ingin mengetahui di negara atau wilayah mana informasinya akan disimpan. Area penilaian yang dimaksud adalah ...","explanation":"Lokasi data adalah salah satu dari tujuh area yang harus diperhatikan dalam pemilihan penyedia cloud.","topic":"Pemilihan penyedia cloud","level":"Penerapan","source":{"file":"Inisiasi 4-MSIM4402.pdf","session":4,"page":3},"options":["Lokasi data","Akses pengguna dengan hak istimewa","Dukungan investigasi","Pemulihan"],"answer":0},{"id":"STSI4402-22","question":"Tim menganggap mesin virtual tidak memerlukan pencadangan aplikasi seketat mesin fisik. Tanggapan yang sesuai dengan praktik tata kelola dalam materi adalah ...","explanation":"Materi menganjurkan perlakuan sistem virtual seperti sistem fisik dalam banyak situasi serta prosedur pencadangan aplikasi yang agresif.","topic":"Tata kelola virtualisasi","level":"Analisis","source":{"file":"Inisiasi 4-MSIM4402.pdf","session":4,"page":5},"options":["Menggantikan pencadangan dengan pemusatan penyimpanan saja","Tetap menerapkan prosedur pencadangan aplikasi yang agresif pada lingkungan virtual","Membatasi pencadangan hanya pada mesin fisik","Mengutamakan penambahan mesin virtual sebelum menetapkan keamanan"],"answer":1},{"id":"STSI4402-23","question":"Kumpulan karakteristik data sistem virtual yang dituju oleh kebijakan dan praktik tata kelola adalah ...","explanation":"Kebijakan sistem virtual dirancang agar data dapat diakses, aman, konsisten, berkualitas tinggi, dan dapat diaudit.","topic":"Kualitas data sistem virtual","level":"Pemahaman","source":{"file":"Inisiasi 4-MSIM4402.pdf","session":4,"page":6},"options":["Terpusat, mahal, tertutup, berukuran kecil, dan selalu baru","Banyak, beragam, sementara, tanpa versi, dan bebas pemilik","Lokal, manual, tercetak, terpisah, dan tanpa kontrol","Dapat diakses, aman, konsisten, berkualitas tinggi, dan dapat diaudit"],"answer":3},{"id":"STSI4402-24","question":"Usulan program keamanan TI dinilai terpisah dari tujuan perusahaan. Prinsip GASSP mana yang seharusnya menjadi dasar penilaiannya?","explanation":"GASSP dalam materi menegaskan bahwa keamanan TI harus mendukung misi perusahaan dan memiliki biaya langsung maupun tidak langsung.","topic":"Prinsip keamanan GASSP","level":"Penerapan","source":{"file":"Inisiasi 4-MSIM4402.pdf","session":4,"page":9},"options":["Keamanan TI harus mendukung misi perusahaan","Keamanan TI cukup dinilai dari banyaknya produk yang dibeli","Tanggung jawab keamanan berhenti pada batas unit TI","Manfaat keamanan hanya memiliki biaya langsung"],"answer":0},{"id":"STSI4402-25","question":"Tim BCP hanya menyiapkan perangkat pengganti tanpa mengkaji layanan, proses bisnis, data, atau kebutuhan pegawai. Perbaikan yang paling sesuai materi adalah ...","explanation":"BCP perlu menganalisis ketergantungan layanan, proses, data, dan teknologi. Strateginya juga mencakup manusia, tempat kerja, informasi, serta peralatan.","topic":"Perencanaan keberlangsungan bisnis","level":"Analisis","source":{"file":"Inisiasi 4-MSIM4402.pdf","session":4,"page":10},"options":["Menganalisis saling ketergantungan dan memilih strategi yang mencakup manusia, tempat kerja, teknologi, informasi, serta perlengkapan","Mengandalkan rencana pemulihan TI tanpa menilai keterkaitan dengan proses bisnis","Menjadikan rencana darurat yang ada sebagai keputusan final tanpa peninjauan","Mengutamakan perangkat dan meninjau kebutuhan manusia setelah gangguan terjadi"],"answer":0},{"id":"STSI4402-26","question":"Apa gagasan pokok SOA menurut materi sesi 5?","explanation":"SOA menyajikan logika bisnis atau fungsi yang dimodulasi sebagai layanan untuk aplikasi konsumen atau klien.","topic":"Konsep SOA","level":"Pemahaman","source":{"file":"Inisiasi 5-MSIM4402.pdf","session":5,"page":2},"options":["Memisahkan seluruh logika bisnis dari kebutuhan aplikasi konsumen","Memodulasi logika bisnis atau fungsi dan menyajikannya sebagai layanan bagi aplikasi konsumen","Mengganti semua aplikasi lama dengan satu perangkat lunak dari vendor yang sama","Menggabungkan semua fungsi ke satu program tanpa antarmuka layanan"],"answer":1},{"id":"STSI4402-27","question":"Perusahaan memiliki aplikasi pada platform dan bahasa pemrograman berbeda yang perlu berkomunikasi. Manfaat SOA yang paling sesuai adalah ...","explanation":"Materi menyebut SOA memungkinkan interoperabilitas antarsistem dan bahasa pemrograman berbeda serta integrasi aplikasi lintas platform.","topic":"Interoperabilitas SOA","level":"Penerapan","source":{"file":"Inisiasi 5-MSIM4402.pdf","session":5,"page":3},"options":["Mendukung interoperabilitas dan integrasi melalui komunikasi jaringan","Mewajibkan semua aplikasi memakai bahasa pemrograman yang sama","Menghilangkan kebutuhan hubungan komunikasi antaraplikasi","Membatasi pertukaran informasi hanya pada satu platform"],"answer":0},{"id":"STSI4402-28","question":"Pengelola layanan ingin memperoleh informasi pelanggan yang konsisten, akurat, dan menyeluruh untuk mengambil keputusan. Kontribusi SOA yang dituju adalah ...","explanation":"Peningkatan visibilitas bisnis melalui SOA mencakup penggabungan data pelanggan yang konsisten dan akurat untuk mendukung keputusan.","topic":"Visibilitas bisnis melalui SOA","level":"Penerapan","source":{"file":"Inisiasi 5-MSIM4402.pdf","session":5,"page":5},"options":["Pemisahan informasi pelanggan di setiap aplikasi","Pengurangan kebutuhan data lintas perusahaan","Peningkatan visibilitas bisnis","Penggantian pengambilan keputusan dengan pembelian perangkat"],"answer":2},{"id":"STSI4402-29","question":"Manajemen menyatakan migrasi SOA selesai setelah paket perangkat lunak dibeli dan staf mengikuti pelatihan. Mengapa kesimpulan ini belum memadai?","explanation":"Materi menegaskan bahwa membeli paket dan melatih staf belum cukup. Perusahaan perlu perencanaan rinci dan kebijakan serta prosedur TI baru.","topic":"Kesiapan penerapan SOA","level":"Analisis","source":{"file":"Inisiasi 5-MSIM4402.pdf","session":5,"page":12},"options":["Perpindahan ke SOA juga memerlukan perencanaan rinci serta kebijakan dan prosedur TI baru","SOA baru berlaku bila semua aplikasi lama dihentikan secara bersamaan","Pelatihan staf justru menggantikan kebutuhan perencanaan dan kebijakan","Pembelian perangkat lunak menghapus kebutuhan mengatur perilaku layanan"],"answer":0},{"id":"STSI4402-30","question":"Setelah sejumlah pembaruan, perusahaan tidak dapat memastikan komponen mana yang berubah. Kebutuhan manajemen konfigurasi yang paling langsung adalah ...","explanation":"Manajemen konfigurasi yang efektif mencakup identifikasi unik komponen dan kontrol untuk menelusuri perubahan atau revisinya.","topic":"Manajemen konfigurasi TI","level":"Penerapan","source":{"file":"Inisiasi 5-MSIM4402.pdf","session":5,"page":14},"options":["Penambahan fungsi aplikasi tanpa identifikasi komponen","Pengelompokan perangkat hanya menurut lokasi ruang kerja","Penghapusan laporan status agar proses pembaruan lebih singkat","Kontrol untuk melacak semua perubahan atau revisi komponen konfigurasi"],"answer":3},{"id":"STSI4402-31","question":"Manakah rangkaian elemen proyek manajemen konfigurasi TI yang sesuai materi?","explanation":"Keempat elemen tersebut secara khusus disebut sebagai isi proyek manajemen konfigurasi TI.","topic":"Proyek manajemen konfigurasi","level":"Pemahaman","source":{"file":"Inisiasi 5-MSIM4402.pdf","session":5,"page":15},"options":["Membangun inventaris, menghapus pelaporan status, menambah komponen, dan melepas kontrol perubahan","Mendokumentasikan perangkat baru, mengabaikan hubungan antarkomponen, dan mengganti standar","Menentukan elemen, membangun hubungan, mengoptimalkan proses, dan mengembangkan dokumentasi yang konsisten","Menentukan elemen, membangun hubungan, menghentikan dokumentasi, dan mengoptimalkan proses"],"answer":2},{"id":"STSI4402-32","question":"Perusahaan memilih produk ERP sebelum merumuskan kebutuhan dan memperkirakan biaya serta waktu. Rekomendasi yang paling sesuai dengan materi adalah ...","explanation":"Implementasi ERP perlu tujuan dan persyaratan yang jelas, tim lintas fungsi, pemahaman biaya serta waktu, pemilihan produk, dan teknik manajemen proyek formal.","topic":"Tata kelola implementasi ERP","level":"Analisis","source":{"file":"Inisiasi 5-MSIM4402.pdf","session":5,"page":16},"options":["Memusatkan pengendalian pada jadwal instalasi tanpa menilai kebutuhan bisnis","Membatasi tim proyek pada pembeli perangkat agar keputusan produk lebih cepat","Mengandalkan keputusan pemasok karena kebutuhan lintas fungsi dapat ditetapkan setelah implementasi","Mendefinisikan tujuan dan persyaratan ERP serta membangun tim lintas fungsi dengan manajemen proyek formal"],"answer":3},{"id":"STSI4402-33","question":"ECM dalam materi terutama menjelaskan strategi, metode, dan alat untuk ...","explanation":"ECM berfokus pada konten dan dokumen yang terkait dengan proses organisasi sepanjang kegiatan pengelolaannya.","topic":"Pengertian ECM","level":"Pemahaman","source":{"file":"Inisiasi 6-MSIM4402.pdf","session":6,"page":2},"options":["Mengelola hanya dokumen yang akan diterbitkan ke situs perusahaan","Mengarsipkan hanya dokumen fisik yang tidak berkaitan dengan proses organisasi","Mendapatkan, mengelola, menyimpan, menjaga, dan menyampaikan konten serta dokumen organisasi","Mengutamakan pemindaian dokumen tanpa pengelolaan dan penyampaiannya"],"answer":2},{"id":"STSI4402-34","question":"Perusahaan memiliki jutaan catatan yang harus disimpan lama dan sewaktu-waktu diambil kembali. Apa yang perlu dipertimbangkan ketika mengadopsi ECM?","explanation":"Penyimpanan catatan jangka panjang dan kebutuhan catatan bervolume tinggi termasuk persyaratan yang perlu dipertimbangkan dalam strategi ECM.","topic":"Persyaratan adopsi ECM","level":"Penerapan","source":{"file":"Inisiasi 6-MSIM4402.pdf","session":6,"page":4},"options":["Persyaratan catatan jangka panjang dan kebutuhan informasi atau catatan volume tinggi","Hanya variasi warna portal yang digunakan untuk menampilkan dokumen","Hanya kecepatan prosesor komputer milik pejabat perusahaan","Penggantian seluruh catatan fisik sebelum kebutuhannya dianalisis"],"answer":0},{"id":"STSI4402-35","question":"Salah satu tujuan dokumen arsitektur referensi ECM adalah ...","explanation":"Dokumen arsitektur referensi memberi masukan bagi pembuatan dan evaluasi arsitektur ECM serta mengomunikasikan keputusan arsitektur kunci.","topic":"Arsitektur referensi ECM","level":"Pemahaman","source":{"file":"Inisiasi 6-MSIM4402.pdf","session":6,"page":5},"options":["Memberikan masukan untuk membuat atau mengevaluasi arsitektur ECM","Menetapkan pilihan produk tanpa mengevaluasi arsitektur yang dibutuhkan","Menghapus kebutuhan mengomunikasikan keputusan arsitektur antarpihak","Membatasi definisi ECM pada alat pemindai dan tempat penyimpanan berkas"],"answer":0},{"id":"STSI4402-36","question":"Tim ingin mengetahui perubahan versi dokumen, mengatur pemakaian ulang, dan membatasi siapa yang dapat membacanya. Area ECM yang paling sesuai adalah ...","explanation":"Manajemen konten digital dalam materi mencakup pembuatan versi, penggunaan ulang konten, kebijakan retensi, dan kontrol akses.","topic":"Manajemen konten digital","level":"Penerapan","source":{"file":"Inisiasi 6-MSIM4402.pdf","session":6,"page":7},"options":["Manajemen cetak dan pengiriman","Manajemen konten digital","Pembuatan konten melalui pemindaian","Manajemen gambar teknis"],"answer":1},{"id":"STSI4402-37","question":"Arsip kertas diubah menjadi konten digital dengan pemindaian, lalu format berkasnya ditransformasikan. Area solusi ECM yang sedang dijalankan adalah ...","explanation":"Pembuatan konten digital dapat menggunakan capturing, scanning, maupun transformasi lintas format.","topic":"Pembuatan konten digital","level":"Penerapan","source":{"file":"Inisiasi 6-MSIM4402.pdf","session":6,"page":7},"options":["Kolaborasi yang berpusat pada dokumen","Pembuatan konten digital","Manajemen konten web","Manajemen arsip setelah masa retensi"],"answer":1},{"id":"STSI4402-38","question":"Manakah pasangan yang termasuk komponen pengembangan dan administrasi ECM dalam materi?","explanation":"Materi menyebut manajemen taksonomi, desain formulir atau template, alur kerja, dan alat penulisan konten sebagai komponen pengembangan dan administrasi ECM.","topic":"Administrasi ECM","level":"Pemahaman","source":{"file":"Inisiasi 6-MSIM4402.pdf","session":6,"page":8},"options":["Penilaian kapabilitas proses dan pemisahan tugas","Virtualisasi server dan pemantauan beban puncak","Manajemen taksonomi dan desain template","Penetapan lokasi data dan dukungan investigasi cloud"],"answer":2},{"id":"STSI4402-39","question":"Dalam tata kelola TI, audit internal dipahami sebagai ...","explanation":"Audit internal adalah fungsi penilaian independen yang dibentuk dalam organisasi untuk memeriksa dan mengevaluasi aktivitas organisasi sebagai layanan.","topic":"Peran audit internal","level":"Pemahaman","source":{"file":"Inisiasi 7-MSIM4402.pdf","session":7,"page":2},"options":["Fungsi penilaian independen di dalam organisasi untuk memeriksa dan mengevaluasi aktivitasnya","Pemasok eksternal yang menetapkan tujuan bisnis perusahaan","Tim pengembang yang bertanggung jawab membuat semua aplikasi","Unit operasi yang memutuskan seluruh perubahan konfigurasi harian"],"answer":0},{"id":"STSI4402-40","question":"Rangkaian kegiatan awal audit internal yang disebut dalam materi adalah ...","explanation":"Materi menyebut penjadwalan, penugasan auditor, dan penilaian awal atau pendahuluan sebagai proses audit internal.","topic":"Tahap awal audit internal","level":"Pemahaman","source":{"file":"Inisiasi 7-MSIM4402.pdf","session":7,"page":4},"options":["Pengadaan perangkat, pemasangan aplikasi, dan serah terima sistem","Penyusunan kode etik, survei karyawan, dan pemindaian dokumen","Penjadwalan audit, penugasan auditor, dan penilaian pendahuluan","Pengembangan layanan, pengujian aplikasi, dan peluncuran produk"],"answer":2},{"id":"STSI4402-41","question":"Sumber daya audit terbatas, sedangkan penugasan mencakup area TI dan bidang lain. Cara penugasan yang paling sesuai materi adalah ...","explanation":"Materi menekankan kesesuaian keahlian auditor dengan penugasan, terutama ketika sumber daya audit langka.","topic":"Penugasan auditor","level":"Penerapan","source":{"file":"Inisiasi 7-MSIM4402.pdf","session":7,"page":5},"options":["Menempatkan spesialis audit TI pada penugasan yang sesuai dan auditor berketerampilan lain pada area yang cocok","Membagi penugasan hanya berdasarkan siapa yang pertama tersedia","Menyerahkan seluruh penugasan kepada auditee agar jadwal lebih mudah","Menempatkan seluruh spesialis TI pada area nonteknis untuk meratakan jumlah auditor"],"answer":0},{"id":"STSI4402-42","question":"Auditor langsung menetapkan pengujian rinci tanpa mengumpulkan informasi tentang area yang akan ditinjau. Langkah apa yang perlu dilakukan terlebih dahulu menurut materi?","explanation":"Sebelum audit aktual, auditor perlu mengumpulkan informasi dan menilai luas serta kedalaman area, pengendalian umum, risiko, dan pendekatan pengujiannya.","topic":"Penilaian audit pendahuluan","level":"Analisis","source":{"file":"Inisiasi 7-MSIM4402.pdf","session":7,"page":5},"options":["Menyusun temuan akhir sebelum luas dan kedalaman audit dipahami","Meminta auditee memilih hasil pengujian yang ingin dilaporkan","Mengganti rencana audit dengan jadwal pembelian perangkat","Penilaian pendahuluan atas ruang lingkup, pengendalian umum, risiko, dan pendekatan pengujian"],"answer":3},{"id":"STSI4402-43","question":"Tim audit harus meninjau pusat data dan bahan yang diamankan sebagai bagian audit terencana. Dokumen apa yang memberikan dasar wewenangnya menurut materi?","explanation":"Dalam materi, piagam memberikan wewenang kepada audit internal untuk memasuki dan meninjau operasi pusat data serta laporan dan bahan yang diamankan dalam audit terencana.","topic":"Piagam audit internal","level":"Penerapan","source":{"file":"Inisiasi 7-MSIM4402.pdf","session":7,"page":8},"options":["Panduan antarmuka pengguna","Daftar inventaris perangkat","Piagam audit internal","Kontrak pembelian aplikasi"],"answer":2},{"id":"STSI4402-44","question":"Organisasi profesi mana yang disebut menerbitkan standar praktik dan perilaku untuk auditor internal?","explanation":"IIA disebut bertanggung jawab menerbitkan standar praktik dan perilaku auditor internal. Panduannya memadukan pernyataan standar wajib dan praktik yang sangat direkomendasikan.","topic":"Standar profesi audit internal","level":"Pemahaman","source":{"file":"Inisiasi 7-MSIM4402.pdf","session":7,"page":8},"options":["Tim arsitektur SOA","AIIM","IIA","Penyedia layanan cloud"],"answer":2},{"id":"STSI4402-45","question":"Peran pernyataan misi dalam tata kelola perusahaan menurut materi adalah ...","explanation":"Pernyataan misi berfungsi sebagai kompas yang menjelaskan tujuan dan nilai perusahaan kepada karyawan, pelanggan, pemegang saham, dan pemangku kepentingan lainnya.","topic":"Misi perusahaan dan tata kelola","level":"Pemahaman","source":{"file":"Inisiasi 8-MSIM4402.pptx","session":8,"page":2},"options":["Menggantikan aturan perilaku yang seharusnya ada dalam kode etik","Merinci setiap pengaturan teknis perangkat jaringan","Membatasi arah perusahaan pada kebutuhan unit TI","Menjelaskan tujuan serta nilai perusahaan dan menjadi sumber arahan bagi pemangku kepentingan"],"answer":3},{"id":"STSI4402-46","question":"Seorang pegawai memberi tahu pihak berwenang tentang dugaan aktivitas ilegal dalam perusahaan. Konsep tata kelola yang paling sesuai dengan tindakan ini adalah ...","explanation":"Whistleblowing berkaitan dengan penyampaian dugaan ketidakjujuran atau aktivitas ilegal kepada publik atau pihak berwenang.","topic":"Whistleblowing","level":"Penerapan","source":{"file":"Inisiasi 8-MSIM4402.pptx","session":8,"page":3},"options":["Pemberian izin akses pusat data kepada vendor","Pelaporan status perubahan konfigurasi kepada manajemen","Whistleblowing","Penyampaian standar praktik audit internal kepada karyawan"],"answer":2},{"id":"STSI4402-47","question":"Kantor pusat telah memiliki tata kelola TI, tetapi unit bisnis menganggap penerapannya bukan tanggung jawab mereka. Pernyataan yang sesuai materi adalah ...","explanation":"Proses tata kelola TI harus diintegrasikan ke operasi inti. Pengelolaan anak perusahaan atau unit bisnis bertanggung jawab memastikan proses yang tepat.","topic":"Integrasi tata kelola TI","level":"Analisis","source":{"file":"Inisiasi 8-MSIM4402.pptx","session":8,"page":4},"options":["Tata kelola TI cukup dijalankan di kantor pusat selama kebijakannya tertulis","Unit bisnis hanya perlu mengikuti tata kelola saat audit eksternal berlangsung","Tanggung jawab unit bisnis dapat digantikan sepenuhnya oleh pemasok aplikasi","Tata kelola TI perlu terintegrasi dalam operasi inti dan pengelolaan tiap unit ikut memastikan proses yang tepat"],"answer":3},{"id":"STSI4402-48","question":"Kode etik hanya menjelaskan perilaku karyawan tetap, sedangkan kontraktor dan vendor tidak diberi pedoman. Perbaikan yang paling sesuai materi adalah ...","explanation":"Kode etik perlu berisi aturan yang jelas dan tidak ambigu tentang harapan terhadap anggota perusahaan, termasuk kontraktor, vendor, dan pemangku kepentingan lain.","topic":"Cakupan kode etik","level":"Penerapan","source":{"file":"Inisiasi 8-MSIM4402.pptx","session":8,"page":5},"options":["Membiarkan setiap kontraktor menetapkan sendiri seluruh aturan perusahaan","Memperjelas pedoman bagi pejabat, karyawan, kontraktor, vendor, dan pemangku kepentingan lain","Mengganti pedoman perilaku dengan daftar produk yang dipasok vendor","Membatasi kode etik pada pejabat agar pengawasan lebih terpusat"],"answer":1},{"id":"STSI4402-49","question":"Seberapa sering perusahaan setidaknya harus meninjau kode etik agar tetap berlaku dan terkini menurut materi?","explanation":"Materi menyatakan kode etik perlu ditinjau secara berkala dan setidaknya setiap dua tahun untuk memastikan pedomannya masih berlaku dan terkini.","topic":"Pemutakhiran kode etik","level":"Pemahaman","source":{"file":"Inisiasi 8-MSIM4402.pptx","session":8,"page":6},"options":["Hanya saat terjadi penggantian CEO","Setiap sepuluh tahun","Hanya ketika perusahaan didirikan","Setiap dua tahun"],"answer":3},{"id":"STSI4402-50","question":"Perusahaan ingin mengurangi dampak negatif penggunaan media sosial oleh para pemangku kepentingannya. Tindakan yang sesuai materi adalah ...","explanation":"Materi mengarahkan perusahaan menetapkan pendidikan, batas perilaku, dan kebijakan spesifik tentang penggunaan alat media sosial oleh pemangku kepentingan.","topic":"Kebijakan media sosial","level":"Penerapan","source":{"file":"Inisiasi 8-MSIM4402.pptx","session":8,"page":10},"options":["Menyerahkan seluruh aturan konten perusahaan kepada akun pribadi pegawai","Membatasi penanganan pada penambahan bandwidth tanpa pedoman perilaku","Memberikan pendidikan serta menjelaskan kegiatan yang boleh dan tidak boleh dilakukan melalui kebijakan yang spesifik","Mengandalkan anggapan bahwa media sosial berada di luar kegiatan bisnis"],"answer":2}]},{"code":"STSI4405","name":"Keamanan Sistem Informasi","reference":"Kode bahan ajar pada katalog UT: MSIM4405, Keamanan Sistem Informasi.","coverage":"Materi Tuton sesi 1–7.","note":"Sesi 8 tidak tersedia pada folder sumber. Latihan ini mengikuti materi sesi 1–7 yang tersedia.","questions":[{"id":"STSI4405-01","question":"Organisasi memiliki firewall, tetapi aturan yang dipasang tidak sesuai kebutuhan perlindungan. Masalah yang paling langsung sesuai kasus tersebut adalah ...","explanation":"Materi mencantumkan konfigurasi firewall yang tidak benar sebagai masalah keamanan sistem informasi. Kasus secara langsung menunjuk pada ketepatan konfigurasinya.","topic":"Konfigurasi keamanan","level":"Penerapan","source":{"file":"Sesi1_Pengantar-Keamanan-Sistem-Informasi.pdf","session":1,"page":2},"options":["Keterpaparan data karena enkripsi yang tidak baik","Tidak adanya tanda tangan digital pada dokumen","Kesalahan pengelolaan token sesi aplikasi","Konfigurasi firewall yang tidak benar"],"answer":3},{"id":"STSI4405-02","question":"Kondisi mana yang secara eksplisit disebut dalam pengenalan masalah keamanan SI sebagai penyebab kerentanan?","explanation":"Materi menyebut adanya kerentanan yang disebabkan oleh bug. Pilihan lain bukan penyebab kerentanan yang dicantumkan pada bagian tersebut.","topic":"Kerentanan perangkat lunak","level":"Pemahaman","source":{"file":"Sesi1_Pengantar-Keamanan-Sistem-Informasi.pdf","session":1,"page":2},"options":["Pencatatan kebijakan keamanan","Penggunaan diagram topologi jaringan","Bug","Pemberian identitas pada WLAN"],"answer":2},{"id":"STSI4405-03","question":"Perusahaan menemukan ancaman dari orang di dalam organisasi yang tidak menandatangani NDA. Mengapa temuan ini relevan sebagai masalah keamanan menurut materi?","explanation":"Materi mengaitkan ancaman orang dalam tanpa NDA dengan kerugian dan rusaknya kredibilitas organisasi. Temuan tersebut tidak membuktikan kondisi teknis lain pada sistem.","topic":"Ancaman orang dalam","level":"Analisis","source":{"file":"Sesi1_Pengantar-Keamanan-Sistem-Informasi.pdf","session":1,"page":2},"options":["Memastikan seluruh data sudah terenkripsi dengan baik","Dapat menimbulkan kerugian dan merusak kredibilitas organisasi","Menunjukkan semua token sesi diterapkan secara benar","Membuktikan semua ancaman selalu berasal dari luar organisasi"],"answer":1},{"id":"STSI4405-04","question":"Tim menemukan ilustrasi masalah berupa virus baru bersamaan dengan tidak dilakukannya pembaruan patch antivirus. Aspek pengamanan yang perlu ditinjau sesuai ilustrasi itu adalah ...","explanation":"Ilustrasi materi memasangkan kemunculan virus baru dengan antivirus yang patch-nya tidak diperbarui. Proses pembaruan perlindungan menjadi aspek yang relevan untuk ditinjau.","topic":"Pembaruan perlindungan","level":"Penerapan","source":{"file":"Sesi1_Pengantar-Keamanan-Sistem-Informasi.pdf","session":1,"page":2},"options":["Penyusunan diagram topologi fisik","Pengaturan masa berlaku sertifikat digital","Pemilihan nama SSID","Pembaruan patch antivirus"],"answer":3},{"id":"STSI4405-05","question":"Aplikasi menyediakan login, tetapi pengelolaan token sesinya tidak diterapkan dengan benar. Kategori kerentanan OWASP dalam materi yang sesuai adalah ...","explanation":"Materi memberi pengelolaan sesi, termasuk token sesi yang tidak diterapkan dengan benar, sebagai contoh otentikasi rusak.","topic":"Otentikasi dan sesi","level":"Penerapan","source":{"file":"Sesi1_Pengantar-Keamanan-Sistem-Informasi.pdf","session":1,"page":5},"options":["Keterpaparan data sensitif akibat enkripsi","Otentikasi rusak","Kesalahan konfigurasi access point","Kerentanan akibat antivirus tidak diperbarui"],"answer":1},{"id":"STSI4405-06","question":"Tinjauan menunjukkan data sensitif aplikasi tidak dienkripsi dengan baik. Kategori masalah pada materi yang tepat adalah ...","explanation":"Dalam daftar kerentanan aplikasi, materi menghubungkan keterpaparan data sensitif dengan enkripsi yang tidak baik. Kasus sesuai kondisi tersebut.","topic":"Perlindungan data sensitif","level":"Penerapan","source":{"file":"Sesi1_Pengantar-Keamanan-Sistem-Informasi.pdf","session":1,"page":5},"options":["Ketidaktepatan urutan siklus PDCA","Kegagalan pemetaan topologi logik","Kesalahan pemberian SSID","Keterpaparan data sensitif"],"answer":3},{"id":"STSI4405-07","question":"Manakah contoh injection flaw yang secara eksplisit tercantum pada daftar kerentanan aplikasi dalam materi sesi 1?","explanation":"Materi menuliskan injection flaws dengan SQL Injection sebagai contoh. Pilihan lainnya merupakan istilah perlindungan atau kriptografi.","topic":"Kerentanan aplikasi","level":"Pemahaman","source":{"file":"Sesi1_Pengantar-Keamanan-Sistem-Informasi.pdf","session":1,"page":5},"options":["Digital signature","SQL Injection","Cipher Block Chaining","Public Key Infrastructure"],"answer":1},{"id":"STSI4405-08","question":"Urutan proses umum kriptografi yang sesuai diagram materi adalah ...","explanation":"Diagram memperlihatkan enkripsi mengubah plain text menjadi ciphertext dan dekripsi mengembalikannya menjadi plain text.","topic":"Proses kriptografi","level":"Pemahaman","source":{"file":"Sesi2_Metode-Kamuflase-Perlindungan-dan-Legitimasi-Informasi.pdf","session":2,"page":2},"options":["Plain text → enkripsi → ciphertext → dekripsi → plain text","Plain text → dekripsi → ciphertext → enkripsi → plain text","Ciphertext → enkripsi → plain text → dekripsi → ciphertext","Plain text → otorisasi → ciphertext → otorisasi → plain text"],"answer":0},{"id":"STSI4405-09","question":"Sebuah rancangan menggunakan shared key yang sama untuk enkripsi dan dekripsi pesan. Rancangan tersebut termasuk ...","explanation":"Kriptografi simetris menggunakan shared key yang sama untuk enkripsi dan dekripsi. Kriptografi asimetris dijelaskan memiliki public key dan private key.","topic":"Klasifikasi kriptografi","level":"Penerapan","source":{"file":"Sesi2_Metode-Kamuflase-Perlindungan-dan-Legitimasi-Informasi.pdf","session":2,"page":3},"options":["Public key cryptography","Digital steganografi","Symmetric key cryptography","Public Key Infrastructure"],"answer":2},{"id":"STSI4405-10","question":"Rancangan X mengenkripsi setiap blok secara terpisah. Rancangan Y mengaitkan ciphertext suatu blok dengan blok sebelumnya dan memakai vektor inisiasi. Pasangan yang sesuai materi adalah ...","explanation":"ECB dijelaskan memproses setiap blok secara terpisah. CBC mengaitkan blok dengan blok sebelumnya dan menggunakan vektor inisiasi.","topic":"Mode block cipher","level":"Analisis","source":{"file":"Sesi2_Metode-Kamuflase-Perlindungan-dan-Legitimasi-Informasi.pdf","session":2,"page":7},"options":["X adalah ECB dan Y adalah CBC","X dan Y sama-sama stream cipher","X dan Y sama-sama ECB","X adalah CBC dan Y adalah ECB"],"answer":0},{"id":"STSI4405-11","question":"Sifat ukuran masukan dan keluaran fungsi hash yang dijelaskan materi adalah ...","explanation":"Materi menyebut fungsi hash menerima jumlah input yang berubah-ubah dan menghasilkan nilai hash berukuran tetap.","topic":"Fungsi hash","level":"Pemahaman","source":{"file":"Sesi2_Metode-Kamuflase-Perlindungan-dan-Legitimasi-Informasi.pdf","session":2,"page":8},"options":["Masukan dapat berubah-ubah, sedangkan keluaran berukuran tetap","Masukan hanya satu karakter dan keluaran selalu satu karakter","Masukan dan keluaran harus selalu berukuran sama","Masukan wajib tetap, sedangkan panjang keluaran selalu berubah"],"answer":0},{"id":"STSI4405-12","question":"Organisasi ingin mengelola pembuatan, penyimpanan, distribusi, dan pembatalan sertifikat digital beserta kebijakan dan prosedurnya. Kerangka yang sesuai materi adalah ...","explanation":"PKI mencakup hardware, software, orang, kebijakan, dan prosedur untuk mengelola sertifikat digital. Kebutuhan kasus sesuai cakupan tersebut.","topic":"Public Key Infrastructure","level":"Penerapan","source":{"file":"Sesi2_Metode-Kamuflase-Perlindungan-dan-Legitimasi-Informasi.pdf","session":2,"page":9},"options":["Electronic Code Book","Single Factor Authentication","Digital steganografi","Public Key Infrastructure"],"answer":3},{"id":"STSI4405-13","question":"Penerima perlu memvalidasi keaslian, integritas, dan bahwa pesan benar datang dari pengirim yang tepat. Mekanisme dalam materi yang memenuhi kebutuhan ini adalah ...","explanation":"Digital signature dijelaskan menyediakan otentikasi pesan, validasi keaslian, dan integritas. Mekanisme ini diperlukan untuk membuktikan ketepatan asal pesan.","topic":"Tanda tangan digital","level":"Penerapan","source":{"file":"Sesi2_Metode-Kamuflase-Perlindungan-dan-Legitimasi-Informasi.pdf","session":2,"page":10},"options":["Pengelompokan channel WiFi","Pemberian SSID","Digital signature","Pembagian jaringan menjadi sel"],"answer":2},{"id":"STSI4405-14","question":"Apa peran OpenPGP menurut materi?","explanation":"OpenPGP dijelaskan sebagai sekumpulan standar format enkripsi pesan, key, dan digital signature.","topic":"PGP dan OpenPGP","level":"Pemahaman","source":{"file":"Sesi2_Metode-Kamuflase-Perlindungan-dan-Legitimasi-Informasi.pdf","session":2,"page":11},"options":["Sekumpulan standar format enkripsi pesan, key, dan digital signature","Perangkat pusat yang mengelola ratusan access point","Teknik pemisahan lapisan jaringan fisik","Protokol pengiriman pesan Bluetooth yang tidak diminta"],"answer":0},{"id":"STSI4405-15","question":"Tim membandingkan kebutuhan mengubah pesan menjadi ciphertext dengan kebutuhan menyembunyikan keberadaan pesan dalam kanal terselubung. Kebutuhan kedua paling sesuai dengan ...","explanation":"Tujuan steganografi digital ialah menyembunyikan informasi dalam kanal terselubung dan mencegah pendeteksian pesan tersembunyi. Kasus berfokus pada penyembunyian keberadaan pesan.","topic":"Steganografi digital","level":"Analisis","source":{"file":"Sesi2_Metode-Kamuflase-Perlindungan-dan-Legitimasi-Informasi.pdf","session":2,"page":13},"options":["Normalisasi log","Digital steganografi","Otorisasi akses","Cipher Block Chaining"],"answer":1},{"id":"STSI4405-16","question":"Mahasiswa berhasil login, tetapi hanya boleh membuka sebagian fasilitas sistem. Kesimpulan yang sesuai materi adalah ...","explanation":"Otentikasi menentukan keabsahan untuk masuk, sedangkan otorisasi menentukan hak melakukan tindakan. Berhasil login tidak berarti memiliki seluruh hak.","topic":"Otentikasi dan otorisasi","level":"Analisis","source":{"file":"Sesi3_Malware-dan-Teknik-Pengamanan-Sistem-Informasi.pdf","session":3,"page":4},"options":["Otorisasi hanya menentukan apakah password pengguna benar","Otentikasi berhasil, sedangkan otorisasi membatasi tindakan yang diizinkan","Otentikasi otomatis memberi hak menggunakan seluruh fasilitas","Pembatasan fasilitas membuktikan proses login tidak pernah berhasil"],"answer":1},{"id":"STSI4405-17","question":"Aplikasi meminta PIN dan token milik pengguna sebelum memberi akses. Berdasarkan contoh materi, metode tersebut adalah ...","explanation":"Materi memberi PIN dan token sebagai contoh otentikasi dua faktor. PIN merupakan faktor pengetahuan dan token merupakan faktor kepemilikan.","topic":"Faktor otentikasi","level":"Penerapan","source":{"file":"Sesi3_Malware-dan-Teknik-Pengamanan-Sistem-Informasi.pdf","session":3,"page":5},"options":["Single Factor Authentication","Open Authentication","Two Factor Authentication","Otorisasi tanpa otentikasi"],"answer":2},{"id":"STSI4405-18","question":"Pesan gagal login mengungkap apakah nama pengguna atau kata sandi yang salah. Perbaikan yang disarankan materi adalah ...","explanation":"Materi menyarankan pesan error yang tidak menginformasikan kredensial apa yang salah. Langkah ini relevan dengan peng
